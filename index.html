<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b63f2" />
    <meta name="description" content="MY STORY — The Experiences That Make Me" />
    <title>MY STORY | The Experiences That Make Me</title>
    <style>
      :root {
        --bg: #edf6ff;
        --bg-strong: #dfeeff;
        --panel: rgba(255, 255, 255, 0.76);
        --panel-strong: rgba(255, 255, 255, 0.9);
        --panel-alt: rgba(15, 49, 94, 0.04);
        --ink: #0d1b2a;
        --muted: #49607d;
        --soft: #6a7d98;
        --line: rgba(19, 47, 82, 0.12);
        --primary: #0b63f2;
        --primary-strong: #094fd1;
        --primary-soft: rgba(11, 99, 242, 0.12);
        --blue-glow: rgba(11, 99, 242, 0.18);
        --shadow: 0 22px 60px rgba(13, 27, 42, 0.12);
        --radius-xl: 30px;
        --radius-lg: 24px;
        --radius-md: 18px;
        --width: 1180px;
      }

      html[data-theme="dark"] {
        color-scheme: dark;
        --bg: #071522;
        --bg-strong: #0d1d2d;
        --panel: rgba(12, 27, 42, 0.78);
        --panel-strong: rgba(17, 35, 52, 0.9);
        --panel-alt: rgba(148, 196, 255, 0.05);
        --ink: #edf7ff;
        --muted: #bfd6f1;
        --soft: #9cc1e9;
        --line: rgba(156, 193, 233, 0.16);
        --primary: #74b3ff;
        --primary-strong: #8bc2ff;
        --primary-soft: rgba(116, 179, 255, 0.14);
        --blue-glow: rgba(116, 179, 255, 0.2);
        --shadow: 0 30px 90px rgba(2, 8, 18, 0.5);
      }

      * { box-sizing: border-box; }
      html { scroll-behavior: smooth; }
      body {
        margin: 0;
        min-height: 100vh;
        font-family: Inter, "Segoe UI", Arial, sans-serif;
        background:
          radial-gradient(circle at top left, rgba(11, 99, 242, 0.18), transparent 24%),
          radial-gradient(circle at top right, rgba(96, 165, 250, 0.18), transparent 22%),
          linear-gradient(180deg, var(--bg) 0%, var(--bg-strong) 100%);
        color: var(--ink);
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
      }

      body::before {
        content: "";
        position: fixed;
        inset: 0;
        pointer-events: none;
        background-image: linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
        background-size: 42px 42px;
        mask-image: radial-gradient(circle at center, black 32%, transparent 100%);
      }

      button, input { font: inherit; }
      button { cursor: pointer; }
      a { color: inherit; }
      img { max-width: 100%; display: block; }
      [hidden] { display: none !important; }

      .app-shell {
        width: min(var(--width), calc(100% - 32px));
        margin: 0 auto;
      }

      .topbar {
        position: sticky;
        top: 0;
        z-index: 50;
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        background: rgba(237, 246, 255, 0.62);
        border-bottom: 1px solid rgba(39, 91, 151, 0.08);
      }

      html[data-theme="dark"] .topbar {
        background: rgba(7, 21, 34, 0.6);
        border-bottom-color: rgba(156, 193, 233, 0.12);
      }

      .topbar-inner {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        min-height: 76px;
      }

      .brand {
        display: inline-flex;
        align-items: center;
        gap: 12px;
        padding: 0;
        border: 0;
        background: transparent;
        color: var(--ink);
        font-size: 12px;
        font-weight: 900;
        letter-spacing: 0.18em;
        text-transform: uppercase;
      }

      .brand-mark {
        display: grid;
        place-items: center;
        width: 38px;
        height: 38px;
        border-radius: 14px;
        background: linear-gradient(135deg, #0b63f2, #60a5fa);
        box-shadow: 0 12px 28px rgba(11, 99, 242, 0.28);
        color: white;
        font-size: 11px;
        letter-spacing: 0;
      }

      .controls {
        display: inline-flex;
        align-items: center;
        gap: 12px;
      }

      .theme-toggle {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        min-width: 118px;
        justify-content: center;
        padding: 10px 14px;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: var(--panel);
        color: var(--ink);
        box-shadow: inset 0 1px 0 rgba(255,255,255,0.2);
      }

      .theme-toggle svg {
        width: 16px;
        height: 16px;
        stroke: currentColor;
        fill: none;
        stroke-width: 1.8;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      .theme-text {
        font-size: 11px;
        font-weight: 800;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }

      .main {
        padding: 40px 0 64px;
      }

      .hero {
        display: grid;
        grid-template-columns: 1.3fr 0.9fr;
        gap: 28px;
        align-items: center;
        padding: 22px 0 18px;
      }

      .eyebrow {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 9px 14px;
        border: 1px solid rgba(11, 99, 242, 0.12);
        border-radius: 999px;
        background: rgba(255,255,255,0.34);
        color: var(--primary-strong);
        font-size: 11px;
        font-weight: 800;
        letter-spacing: 0.18em;
        text-transform: uppercase;
      }

      .eyebrow-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: linear-gradient(135deg, #0b63f2, #7cc4ff);
        box-shadow: 0 0 0 6px rgba(11, 99, 242, 0.1);
      }

      h1 {
        margin: 18px 0 16px;
        font-size: clamp(3rem, 5vw, 6rem);
        line-height: 0.94;
        letter-spacing: -0.07em;
      }

      .lead {
        max-width: 680px;
        margin: 0;
        color: var(--muted);
        font-size: 1.08rem;
        line-height: 1.9;
      }

      .hero-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 14px;
        margin-top: 28px;
      }

      .primary-btn, .secondary-btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        min-height: 52px;
        padding: 0 22px;
        border-radius: 16px;
        border: 1px solid transparent;
        font-size: 0.82rem;
        font-weight: 800;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        transition: transform 0.18s ease, box-shadow 0.18s ease, border-color 0.18s ease;
      }

      .primary-btn {
        background: linear-gradient(135deg, var(--primary) 0%, #5ea4ff 100%);
        color: white;
        box-shadow: 0 16px 30px rgba(11, 99, 242, 0.24);
      }

      .secondary-btn {
        border-color: var(--line);
        background: var(--panel);
        color: var(--ink);
      }

      .primary-btn:hover, .secondary-btn:hover, .theme-toggle:hover, .album-card:hover, .chip:hover, .stat:hover {
        transform: translateY(-2px);
      }

      .hero-panel {
        position: relative;
        min-height: 420px;
        padding: 22px;
        border: 1px solid var(--line);
        border-radius: 32px;
        background: linear-gradient(180deg, rgba(255,255,255,0.1), rgba(255,255,255,0.04));
        box-shadow: var(--shadow);
        overflow: hidden;
      }

      .hero-panel::before {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(135deg, rgba(11,99,242,0.18), rgba(124,196,255,0.04), transparent 50%);
      }

      .hero-stack {
        position: relative;
        z-index: 1;
        display: grid;
        gap: 18px;
      }

      .mini-card {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 14px;
        padding: 16px 18px;
        border: 1px solid var(--line);
        border-radius: 22px;
        background: rgba(255,255,255,0.2);
      }

      .mini-card strong {
        display: block;
        font-size: 1.1rem;
        letter-spacing: -0.04em;
      }

      .mini-card span {
        color: var(--muted);
        font-size: 0.75rem;
        font-weight: 700;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }

      .mini-icon {
        display: grid;
        place-items: center;
        width: 52px;
        height: 52px;
        border-radius: 16px;
        background: linear-gradient(135deg, rgba(11,99,242,0.15), rgba(124,196,255,0.12));
        color: var(--primary-strong);
      }

      .mini-icon svg {
        width: 22px;
        height: 22px;
        stroke: currentColor;
        fill: none;
        stroke-width: 1.8;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      .hero-shape {
        position: absolute;
        right: 18px;
        bottom: 18px;
        width: 180px;
        height: 180px;
        border-radius: 32px;
        background: linear-gradient(135deg, rgba(11,99,242,0.18), rgba(108,175,255,0.04));
        transform: rotate(12deg);
      }

      .hero-shape::before,
      .hero-shape::after {
        content: "";
        position: absolute;
        border-radius: 24px;
      }

      .hero-shape::before {
        inset: 24px 26px 28px 18px;
        background: linear-gradient(135deg, rgba(11,99,242,0.16), rgba(255,255,255,0.14));
      }

      .hero-shape::after {
        inset: 58px 58px 52px 52px;
        background: rgba(255,255,255,0.38);
        border: 1px solid rgba(255,255,255,0.25);
      }

      .stats {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 18px;
        margin-top: 28px;
      }

      .stat {
        position: relative;
        padding: 22px 18px;
        border: 1px solid var(--line);
        border-radius: 22px;
        background: var(--panel);
        box-shadow: var(--shadow);
      }

      .stat-icon {
        display: grid;
        place-items: center;
        width: 46px;
        height: 46px;
        margin-bottom: 16px;
        border-radius: 14px;
        background: linear-gradient(135deg, rgba(11,99,242,0.15), rgba(96,165,250,0.2));
        color: var(--primary-strong);
      }

      .stat-icon svg {
        width: 22px;
        height: 22px;
        stroke: currentColor;
        fill: none;
        stroke-width: 1.7;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      .stat strong {
        display: block;
        font-size: clamp(1.5rem, 2vw, 2.2rem);
        letter-spacing: -0.06em;
      }

      .stat span {
        display: block;
        margin-top: 8px;
        color: var(--muted);
        font-size: 0.8rem;
        font-weight: 700;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      .section-header {
        display: flex;
        align-items: end;
        justify-content: space-between;
        gap: 12px;
        margin: 52px 0 18px;
      }

      .section-title {
        margin: 0;
        font-size: clamp(1.8rem, 3vw, 3rem);
        letter-spacing: -0.06em;
      }

      .section-subtitle {
        margin: 0;
        color: var(--muted);
        font-size: 0.92rem;
        letter-spacing: 0.1em;
        text-transform: uppercase;
      }

      .album-grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 22px;
      }

      .album-card {
        padding: 0;
        border: 1px solid var(--line);
        border-radius: 26px;
        background: var(--panel);
        box-shadow: var(--shadow);
        overflow: hidden;
        text-align: left;
        transition: transform 0.2s ease, border-color 0.2s ease;
      }

      .album-cover {
        position: relative;
        display: block;
        height: 240px;
        overflow: hidden;
        background: linear-gradient(135deg, rgba(11,99,242,0.1), rgba(124,196,255,0.08));
      }

      .album-cover::before {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(180deg, transparent 25%, rgba(7,8,16,0.32));
      }

      .album-cover svg {
        position: absolute;
        inset: 0;
        z-index: 1;
        width: 100%;
        height: 100%;
        opacity: 0.75;
      }

      .album-cover .cover-number {
        position: absolute;
        right: 18px;
        bottom: 18px;
        z-index: 2;
        font-size: 0.7rem;
        font-weight: 800;
        letter-spacing: 0.18em;
        color: rgba(255,255,255,0.96);
        text-shadow: 0 8px 22px rgba(0,0,0,0.28);
      }

      .album-info {
        display: block;
        padding: 18px 18px 22px;
      }

      .album-title {
        display: block;
        font-size: 1.3rem;
        line-height: 1.2;
        letter-spacing: -0.05em;
      }

      .album-desc {
        display: block;
        margin-top: 8px;
        color: var(--muted);
        font-size: 0.82rem;
        line-height: 1.7;
      }

      .meta-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        margin-top: 16px;
      }

      .chip {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 7px 10px;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: var(--panel-alt);
        color: var(--muted);
        font-size: 0.7rem;
        font-weight: 800;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      .chip svg {
        width: 12px;
        height: 12px;
        stroke: currentColor;
        fill: none;
        stroke-width: 1.8;
      }

      .album-pointer {
        color: var(--primary-strong);
        font-size: 0.74rem;
        font-weight: 900;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }

      .footer {
        padding: 28px 0 48px;
        color: var(--muted);
        font-size: 0.74rem;
        font-weight: 800;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }

      .footer-inner {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding-top: 24px;
        border-top: 1px solid var(--line);
      }

      @media (max-width: 980px) {
        .hero { grid-template-columns: 1fr; }
        .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
        .album-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      }

      @media (max-width: 640px) {
        .topbar-inner { min-height: 68px; }
        .brand { letter-spacing: 0.1em; }
        .theme-text { display: none; }
        .stats { grid-template-columns: 1fr; }
        .album-grid { grid-template-columns: 1fr; }
        .hero-panel { min-height: 330px; }
        .hero-actions { flex-direction: column; }
        .primary-btn, .secondary-btn { width: 100%; }
        .footer-inner { flex-direction: column; align-items: flex-start; }
      }
    </style>
  </head>
  <body>
    <header class="topbar">
      <div class="app-shell topbar-inner">
        <button class="brand" type="button" id="brandButton" aria-label="Home">
          <span class="brand-mark" aria-hidden="true">MS</span>
          <span>My Story</span>
        </button>

        <div class="controls">
          <button class="theme-toggle" id="themeToggle" type="button" aria-label="Toggle theme">
            <svg id="themeIcon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M21 12.8A9 9 0 0 1 11.2 3a9 9 0 1 0 9.8 9.8Z"/>
            </svg>
            <span class="theme-text" id="themeText">Night</span>
          </button>
        </div>
      </div>
    </header>

    <main class="main app-shell">
      <section class="hero">
        <div>
          <div class="eyebrow"><span class="eyebrow-dot" aria-hidden="true"></span> Personal Journey</div>
          <h1 id="heroTitle">MY STORY</h1>
          <p class="lead" id="heroSubtitle">The Experiences That Make Me</p>

          <div class="hero-actions">
            <button class="primary-btn" type="button" id="exploreButton">Explore memories</button>
            <button class="secondary-btn" type="button" id="themeButton">Toggle mode</button>
          </div>
        </div>

        <div class="hero-panel" aria-label="Featured gallery summary">
          <div class="hero-stack">
            <div class="mini-card">
              <div>
                <span>Life chapters</span>
                <strong>3 albums</strong>
              </div>
              <div class="mini-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24"><path d="M3 7.5A2.5 2.5 0 0 1 5.5 5h13A2.5 2.5 0 0 1 21 7.5v9A2.5 2.5 0 0 1 18.5 19h-13A2.5 2.5 0 0 1 3 16.5v-9Z"/><path d="M8 5v14M16 5v14M3 10h18"/></svg>
              </div>
            </div>

            <div class="mini-card">
              <div>
                <span>Favorite memories</span>
                <strong>My legacy</strong>
              </div>
              <div class="mini-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24"><path d="M12 3v18M4 7.5c0-1.9 1.6-3.5 3.5-3.5h9c1.9 0 3.5 1.6 3.5 3.5v1.1c0 1.8-1.5 3.3-3.3 3.3H7.3A3.3 3.3 0 0 1 4 8.6V7.5Z"/><path d="M7 15.5h10a3 3 0 0 1 3 3V17a3 3 0 0 1-3 3H7a3 3 0 0 1-3-3v-1.5a3 3 0 0 1 3-3Z"/></svg>
              </div>
            </div>

            <div class="mini-card">
              <div>
                <span>Core values</span>
                <strong>Growth & courage</strong>
              </div>
              <div class="mini-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24"><path d="M12 2.8 14.9 8l5.6.8-4.1 4 1 5.6-5.4-2.8-5.4 2.8 1-5.6-4.1-4 5.6-.8L12 2.8Z"/></svg>
              </div>
            </div>
          </div>

          <div class="hero-shape" aria-hidden="true"></div>
        </div>
      </section>

      <section class="stats" aria-label="Key story highlights">
        <article class="stat">
          <div class="stat-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="M3 9.5V6.8A1.8 1.8 0 0 1 4.8 5h14.4A1.8 1.8 0 0 1 21 6.8v2.7"/><path d="M3 16.2v1A1.8 1.8 0 0 0 4.8 19h14.4a1.8 1.8 0 0 0 1.8-1.8v-1"/><path d="M8.5 5v14M15.5 5v14M3 12h18"/></svg>
          </div>
          <strong>3</strong>
          <span>Life chapters</span>
        </article>

        <article class="stat">
          <div class="stat-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="M4 17.5 10 11l4 4 6-8"/><path d="M18 7h2v2"/></svg>
          </div>
          <strong>100%</strong>
          <span>Driven by passion</span>
        </article>

        <article class="stat">
          <div class="stat-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="M7 14.5 12 8l5 6.5"/><path d="M12 8V4"/><path d="M5 18h14"/></svg>
          </div>
          <strong>∞</strong>
          <span>Moments to remember</span>
        </article>
      </section>

      <div class="section-header">
        <div>
          <p class="section-subtitle">Story timeline</p>
          <h2 class="section-title">Photo albums</h2>
        </div>
      </div>

      <section class="album-grid" id="albumGrid" aria-label="Photo albums"></section>

      <footer class="footer">
        <div class="footer-inner">
          <span>MY STORY</span>
          <span>The Experiences That Make Me</span>
        </div>
      </footer>
    </main>

    <script>
      const ALBUMS = [
        { id: '1', number: '01', key: 'childhood', title: 'My Childhood', summary: 'The roots of my story', icon: 'sparkle', bg: 'linear-gradient(135deg, #cfe6ff 0%, #7db6ff 100%)' },
        { id: '2', number: '02', key: 'aviation', title: 'Aviation Journey', summary: 'Dreams that lifted me', icon: 'flight', bg: 'linear-gradient(135deg, #9ac6ff 0%, #2b6ae8 100%)' },
        { id: '3', number: '03', key: 'wrestling', title: 'Passion for Wrestling', summary: 'Discipline, strength, and grit', icon: 'trophy', bg: 'linear-gradient(135deg, #87d6ff 0%, #1477d3 100%)' }
      ];

      const root = document.documentElement;
      const savedTheme = localStorage.getItem('my-story-theme');
      const preferredTheme = savedTheme || 'light';
      root.setAttribute('data-theme', preferredTheme);

      const themeIcon = document.getElementById('themeIcon');
      const themeText = document.getElementById('themeText');
      const heroTitle = document.getElementById('heroTitle');
      const heroSubtitle = document.getElementById('heroSubtitle');
      const albumGrid = document.getElementById('albumGrid');

      function setTheme(theme) {
        root.setAttribute('data-theme', theme);
        localStorage.setItem('my-story-theme', theme);
        const isDark = theme === 'dark';
        themeText.textContent = isDark ? 'Day' : 'Night';
        themeIcon.innerHTML = isDark
          ? '<path d="M12 3v2.5M12 18.5V21M4.93 4.93l1.77 1.77M17.3 17.3l1.77 1.77M3 12h2.5M18.5 12H21M4.93 19.07l1.77-1.77M17.3 6.7l1.77-1.77"/><circle cx="12" cy="12" r="4.5"/>'
          : '<path d="M21 12.8A9 9 0 0 1 11.2 3a9 9 0 1 0 9.8 9.8Z"/>';
      }

      function renderAlbumCards() {
        albumGrid.innerHTML = '';

        ALBUMS.forEach((album) => {
          const card = document.createElement('button');
          card.type = 'button';
          card.className = 'album-card';
          card.setAttribute('aria-label', `Open ${album.title}`);

          const cover = document.createElement('span');
          cover.className = 'album-cover';
          cover.style.background = album.bg;

          const iconSvg = {
            sparkle: '<svg viewBox="0 0 24 24"><path d="M12 2.5v5M12 16.5v5M2.5 12h5M16.5 12h5M5.5 5.5l3.6 3.6M14.9 14.9l3.6 3.6M5.5 18.5l3.6-3.6M14.9 9.1l3.6-3.6"/></svg>',
            flight: '<svg viewBox="0 0 24 24"><path d="M2 16l7-2 8-8 3 3-8 8-2 7-2-7-6-1Z"/><path d="M13 6l5 5"/></svg>',
            trophy: '<svg viewBox="0 0 24 24"><path d="M8 4h8v3a4 4 0 0 1-8 0V4Z"/><path d="M6 4H4v2a4 4 0 0 0 4 4"/><path d="M18 4h2v2a4 4 0 0 1-4 4"/><path d="M12 11v5"/><path d="M9 20h6"/><path d="M7 18h10"/></svg>'
          };

          cover.innerHTML = `${iconSvg[album.icon] || iconSvg.sparkle}<span class="cover-number">${album.number}</span>`;

          const info = document.createElement('span');
          info.className = 'album-info';

          const title = document.createElement('span');
          title.className = 'album-title';
          title.textContent = album.title;

          const desc = document.createElement('span');
          desc.className = 'album-desc';
          desc.textContent = album.summary;

          const metaRow = document.createElement('span');
          metaRow.className = 'meta-row';

          const chip = document.createElement('span');
          chip.className = 'chip';
          chip.innerHTML = '<svg viewBox="0 0 24 24"><path d="M4 12h16M12 4v16"/></svg> Story';

          const pointer = document.createElement('span');
          pointer.className = 'album-pointer';
          pointer.textContent = 'Open';

          metaRow.append(chip, pointer);
          info.append(title, desc, metaRow);
          card.append(cover, info);

          card.addEventListener('click', () => {
            heroTitle.textContent = album.title;
            heroSubtitle.textContent = album.summary;
            window.scrollTo({ top: 0, behavior: 'smooth' });
          });

          albumGrid.appendChild(card);
        });
      }

      document.getElementById('themeToggle').addEventListener('click', () => {
        const nextTheme = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
        setTheme(nextTheme);
      });

      document.getElementById('themeButton').addEventListener('click', () => {
        const nextTheme = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
        setTheme(nextTheme);
      });

      document.getElementById('exploreButton').addEventListener('click', () => {
        albumGrid.scrollIntoView({ behavior: 'smooth', block: 'start' });
      });

      document.getElementById('brandButton').addEventListener('click', () => {
        heroTitle.textContent = 'MY STORY';
        heroSubtitle.textContent = 'The Experiences That Make Me';
        window.scrollTo({ top: 0, behavior: 'smooth' });
      });

      setTheme(preferredTheme);
      renderAlbumCards();
    </script>
  </body>
</html>
