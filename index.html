<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b63f2" />
    <meta name="description" content="Personal photo album" />
    <title>My Story</title>
    <style>
      :root {
        --bg: #f5f8fb;
        --bg-strong: #edf3fa;
        --panel: rgba(255,255,255,0.82);
        --ink: #111827;
        --muted: #54657e;
        --line: rgba(17,24,39,0.08);
        --brand: #0b63f2;
        --brand-strong: #094ed1;
        --shadow: 0 18px 40px rgba(17,24,39,0.08);
      }

      html[data-theme="dark"] {
        color-scheme: dark;
        --bg: #07141d;
        --bg-strong: #0b1c2d;
        --panel: rgba(12,20,30,0.78);
        --ink: #edf6ff;
        --muted: #b9cfe9;
        --line: rgba(185,207,233,0.15);
        --brand: #7ab7ff;
        --brand-strong: #9dc9ff;
        --shadow: 0 22px 60px rgba(0,0,0,0.32);
      }

      * { box-sizing: border-box; }
      html { scroll-behavior: smooth; }
      body {
        margin: 0;
        min-height: 100vh;
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", sans-serif;
        background: linear-gradient(180deg, var(--bg) 0%, var(--bg-strong) 100%);
        color: var(--ink);
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
      }

      button { font: inherit; cursor: pointer; }
      img { display: block; max-width: 100%; }
      [hidden] { display: none !important; }

      .app-shell {
        width: min(1180px, calc(100% - 28px));
        margin: 0 auto;
      }

      .topbar {
        position: sticky;
        top: 0;
        z-index: 20;
        background: rgba(245,248,251,0.72);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border-bottom: 1px solid var(--line);
      }

      html[data-theme="dark"] .topbar {
        background: rgba(7,20,29,0.7);
      }

      .topbar-inner {
        display: flex;
        align-items: center;
        justify-content: space-between;
        min-height: 68px;
      }

      .brand {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        border: 0;
        background: transparent;
        padding: 0;
        color: var(--ink);
        font-size: 11px;
        font-weight: 800;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }

      .brand-mark {
        display: grid;
        place-items: center;
        width: 32px;
        height: 32px;
        border-radius: 10px;
        background: linear-gradient(135deg, var(--brand), #7bb9ff);
        color: white;
        font-size: 10px;
        letter-spacing: 0;
        box-shadow: 0 10px 24px rgba(11,99,242,0.25);
      }

      .theme-toggle {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        min-width: 96px;
        padding: 9px 12px;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: var(--panel);
        color: var(--ink);
      }

      .theme-toggle svg {
        width: 15px;
        height: 15px;
        stroke: currentColor;
        fill: none;
        stroke-width: 1.8;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      .theme-text {
        font-size: 10px;
        font-weight: 800;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }

      .main {
        padding: 18px 0 28px;
      }

      .title-row {
        display: flex;
        align-items: end;
        justify-content: space-between;
        gap: 12px;
        margin: 10px 0 18px;
      }

      .eyebrow {
        margin: 0;
        color: var(--muted);
        font-size: 10px;
        font-weight: 800;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }

      h1 {
        margin: 8px 0 0;
        font-size: clamp(2.1rem, 4vw, 4rem);
        line-height: 0.96;
        letter-spacing: -0.07em;
      }

      .album-grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 18px;
      }

      .album-card {
        padding: 0;
        border: 1px solid var(--line);
        border-radius: 18px;
        background: var(--panel);
        box-shadow: var(--shadow);
        overflow: hidden;
        text-align: left;
      }

      .album-cover {
        position: relative;
        display: block;
        width: 100%;
        aspect-ratio: 1 / 1.08;
        background: #eaf1f9;
      }

      .album-cover img {
        width: 100%;
        height: 100%;
        object-fit: contain;
        background: #eff5fb;
      }

      .album-info {
        display: block;
        padding: 12px 12px 14px;
      }

      .album-title {
        display: block;
        color: var(--ink);
        font-size: 1rem;
        line-height: 1.3;
        letter-spacing: -0.04em;
        font-weight: 700;
      }

      .album-view {
        display: none;
      }

      .album-view.active {
        display: block;
      }

      .gallery-topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin: 8px 0 18px;
      }

      .back-button {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 10px 12px;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: var(--panel);
        color: var(--ink);
        font-size: 11px;
        font-weight: 800;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      .back-button svg {
        width: 14px;
        height: 14px;
        stroke: currentColor;
        fill: none;
        stroke-width: 2;
      }

      .gallery-grid {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 10px;
      }

      .photo-tile {
        position: relative;
        display: block;
        width: 100%;
        aspect-ratio: 1 / 1;
        padding: 0;
        border: 1px solid var(--line);
        border-radius: 12px;
        overflow: hidden;
        background: rgba(17,24,39,0.04);
      }

      .photo-tile img {
        width: 100%;
        height: 100%;
        object-fit: contain;
        background: #f0f4f9;
      }

      .photo-index {
        position: absolute;
        right: 8px;
        bottom: 7px;
        color: rgba(255,255,255,0.95);
        font-size: 9px;
        font-weight: 800;
        letter-spacing: 0.12em;
        text-shadow: 0 2px 12px rgba(0,0,0,0.35);
      }

      .viewer {
        position: fixed;
        inset: 0;
        margin: 0;
        padding: 0;
        border: 0;
        background: rgba(4,8,14,0.9);
      }

      .viewer::backdrop {
        background: rgba(4,8,14,0.92);
      }

      .viewer-shell {
        display: grid;
        grid-template-rows: auto 1fr auto;
        width: 100%;
        height: 100%;
        max-height: 100vh;
        padding: max(10px, env(safe-area-inset-top)) 12px max(12px, env(safe-area-inset-bottom));
      }

      .viewer-header {
        display: grid;
        grid-template-columns: 42px 1fr 42px;
        align-items: center;
        gap: 8px;
        min-height: 52px;
      }

      .viewer-icon {
        display: grid;
        place-items: center;
        width: 38px;
        height: 38px;
        border: 1px solid rgba(255,255,255,0.14);
        border-radius: 50%;
        background: rgba(255,255,255,0.08);
        color: white;
      }

      .viewer-icon svg {
        width: 18px;
        height: 18px;
        stroke: currentColor;
        fill: none;
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      .viewer-title-wrap {
        text-align: center;
        color: white;
      }

      .viewer-title {
        display: block;
        font-size: 11px;
        font-weight: 800;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }

      .viewer-count {
        display: block;
        margin-top: 4px;
        color: rgba(255,255,255,0.72);
        font-size: 9px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      .viewer-stage {
        position: relative;
        display: grid;
        place-items: center;
        min-height: 0;
        padding: 8px 40px;
      }

      .viewer-stage img {
        max-width: 100%;
        max-height: calc(100vh - 180px);
        width: auto;
        height: auto;
        object-fit: contain;
        border-radius: 16px;
        box-shadow: 0 18px 42px rgba(0,0,0,0.28);
      }

      .viewer-arrow {
        position: absolute;
        top: 50%;
        transform: translateY(-50%);
        z-index: 1;
      }

      .viewer-prev { left: 6px; }
      .viewer-next { right: 6px; }

      .viewer-bottom {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        min-height: 52px;
        color: rgba(255,255,255,0.75);
      }

      .viewer-caption {
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
        font-size: 11px;
        letter-spacing: 0.04em;
      }

      .viewer-progress {
        display: flex;
        align-items: center;
        gap: 6px;
        flex-shrink: 0;
      }

      .progress-dot {
        display: block;
        width: 5px;
        height: 5px;
        border-radius: 99px;
        background: rgba(255,255,255,0.32);
      }

      .progress-dot.active {
        width: 16px;
        background: white;
      }

      @media (max-width: 900px) {
        .album-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
        .gallery-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
      }

      @media (max-width: 560px) {
        .album-grid, .gallery-grid { grid-template-columns: 1fr; }
        .theme-text { display: none; }
        .title-row { align-items: center; }
        .viewer-stage { padding-inline: 30px; }
      }
    </style>
  </head>
  <body>
    <header class="topbar">
      <div class="app-shell topbar-inner">
        <button id="brandButton" class="brand" type="button" aria-label="Home">
          <span class="brand-mark" aria-hidden="true">MS</span>
          <span>My Story</span>
        </button>

        <button id="themeToggle" class="theme-toggle" type="button" aria-label="Toggle theme">
          <svg id="themeIcon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M21 12.8A9 9 0 0 1 11.2 3a9 9 0 1 0 9.8 9.8Z"/>
          </svg>
          <span class="theme-text" id="themeText">Night</span>
        </button>
      </div>
    </header>

    <main class="main app-shell">
      <section id="homeView">
        <div class="title-row">
          <div>
            <p class="eyebrow">Albums</p>
            <h1>My Story</h1>
          </div>
        </div>

        <div id="albumGrid" class="album-grid" aria-live="polite"></div>
      </section>

      <section id="albumView" class="album-view" aria-live="polite">
        <div class="gallery-topbar">
          <button id="backButton" class="back-button" type="button">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m14.5 5-7 7 7 7M8 12h12"/></svg>
            <span>Albums</span>
          </button>
          <div class="eyebrow" id="galleryEyebrow">Gallery</div>
        </div>

        <div class="title-row" style="margin-top:0; margin-bottom: 12px;">
          <div>
            <p class="eyebrow" id="albumEyebrow">Album</p>
            <h1 id="albumTitle">Album</h1>
          </div>
        </div>

        <div id="galleryGrid" class="gallery-grid"></div>
      </section>
    </main>

    <dialog id="photoViewer" class="viewer" aria-label="Photo viewer">
      <div class="viewer-shell">
        <div class="viewer-header">
          <button id="closeViewer" class="viewer-icon" type="button" aria-label="Close photo">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg>
          </button>

          <div class="viewer-title-wrap">
            <span id="viewerTitle" class="viewer-title">Album</span>
            <span id="viewerCount" class="viewer-count">1 / 1</span>
          </div>

          <span aria-hidden="true"></span>
        </div>

        <div class="viewer-stage">
          <button id="previousPhoto" class="viewer-icon viewer-arrow viewer-prev" type="button" aria-label="Previous photo">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>
          </button>
          <img id="viewerImage" src="" alt="" />
          <button id="nextPhoto" class="viewer-icon viewer-arrow viewer-next" type="button" aria-label="Next photo">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>
          </button>
        </div>

        <div class="viewer-bottom">
          <div id="viewerCaption" class="viewer-caption"></div>
          <div id="viewerProgress" class="viewer-progress" aria-hidden="true"></div>
        </div>
      </div>
    </dialog>

    <script>
      const albumMeta = {
        '1': { title: 'My Childhood' },
        '2': { title: 'Aviation Journey' },
        '3': { title: 'Passion for Wrestling' }
      };

      const state = {
        albums: {},
        activeAlbumId: null,
        activePhotoIndex: 0
      };

      const albumGrid = document.getElementById('albumGrid');
      const homeView = document.getElementById('homeView');
      const albumView = document.getElementById('albumView');
      const galleryGrid = document.getElementById('galleryGrid');
      const albumEyebrow = document.getElementById('albumEyebrow');
      const albumTitle = document.getElementById('albumTitle');
      const galleryEyebrow = document.getElementById('galleryEyebrow');
      const photoViewer = document.getElementById('photoViewer');
      const viewerImage = document.getElementById('viewerImage');
      const viewerTitle = document.getElementById('viewerTitle');
      const viewerCount = document.getElementById('viewerCount');
      const viewerCaption = document.getElementById('viewerCaption');
      const viewerProgress = document.getElementById('viewerProgress');

      function setTheme(theme) {
        document.documentElement.setAttribute('data-theme', theme);
        localStorage.setItem('my-story-theme', theme);
        const isDark = theme === 'dark';
        document.getElementById('themeText').textContent = isDark ? 'Day' : 'Night';
        document.getElementById('themeIcon').innerHTML = isDark
          ? '<path d="M12 3v2.5M12 18.5V21M4.93 4.93l1.77 1.77M17.3 17.3l1.77 1.77M3 12h2.5M18.5 12H21M4.93 19.07l1.77-1.77M17.3 6.7l1.77-1.77"/><circle cx="12" cy="12" r="4.5"/>'
          : '<path d="M21 12.8A9 9 0 0 1 11.2 3a9 9 0 1 0 9.8 9.8Z"/>';
      }

      function toLabel(fileName) {
        return fileName
          .replace(/\.[^.]+$/, '')
          .replace(/[_-]+/g, ' ')
          .replace(/\s+/g, ' ')
          .trim() || 'Photo';
      }

      function getAlbumPhotos(albumId) {
        return state.albums[albumId] || [];
      }

      function renderAlbumCards() {
        const ids = Object.keys(state.albums).sort();
        albumGrid.innerHTML = '';

        ids.forEach((albumId) => {
          const photos = getAlbumPhotos(albumId);
          const album = albumMeta[albumId] || { title: `Album ${albumId}` };
          const firstPhoto = photos[0]?.src || '';

          const card = document.createElement('button');
          card.type = 'button';
          card.className = 'album-card';
          card.setAttribute('aria-label', `Open ${album.title}`);
          card.addEventListener('click', () => openAlbum(albumId));

          const cover = document.createElement('span');
          cover.className = 'album-cover';

          if (firstPhoto) {
            const img = document.createElement('img');
            img.src = firstPhoto;
            img.alt = album.title;
            img.loading = 'lazy';
            cover.appendChild(img);
          }

          const info = document.createElement('span');
          info.className = 'album-info';

          const title = document.createElement('span');
          title.className = 'album-title';
          title.textContent = album.title;

          info.appendChild(title);
          card.append(cover, info);
          albumGrid.appendChild(card);
        });
      }

      function openAlbum(albumId) {
        const photos = getAlbumPhotos(albumId);
        if (!photos.length) return;

        state.activeAlbumId = albumId;
        state.activePhotoIndex = 0;

        const album = albumMeta[albumId] || { title: `Album ${albumId}` };
        homeView.hidden = true;
        albumView.classList.add('active');
        albumEyebrow.textContent = `Album ${albumId}`;
        albumTitle.textContent = album.title;
        galleryEyebrow.textContent = `${photos.length} photos`;

        galleryGrid.innerHTML = '';
        photos.forEach((photo, index) => {
          const tile = document.createElement('button');
          tile.type = 'button';
          tile.className = 'photo-tile';
          tile.setAttribute('aria-label', `Open photo ${index + 1}`);
          tile.addEventListener('click', () => openViewer(index));

          const img = document.createElement('img');
          img.src = photo.src;
          img.alt = photo.label;
          img.loading = 'lazy';
          tile.appendChild(img);

          const num = document.createElement('span');
          num.className = 'photo-index';
          num.textContent = String(index + 1).padStart(2, '0');
          tile.appendChild(num);

          galleryGrid.appendChild(tile);
        });
      }

      function closeAlbum() {
        state.activeAlbumId = null;
        homeView.hidden = false;
        albumView.classList.remove('active');
        if (photoViewer.open) photoViewer.close();
      }

      function buildProgress(count) {
        viewerProgress.innerHTML = '';
        for (let i = 0; i < count; i++) {
          const dot = document.createElement('span');
          dot.className = `progress-dot${i === state.activePhotoIndex ? ' active' : ''}`;
          viewerProgress.appendChild(dot);
        }
      }

      function openViewer(index) {
        const albumId = state.activeAlbumId;
        const photos = getAlbumPhotos(albumId);
        if (!photos.length) return;

        state.activePhotoIndex = index;
        const photo = photos[index];
        if (!photo) return;

        viewerTitle.textContent = albumMeta[albumId]?.title || `Album ${albumId}`;
        viewerCount.textContent = `${String(index + 1).padStart(2, '0')} / ${String(photos.length).padStart(2, '0')}`;
        viewerCaption.textContent = photo.label;
        viewerImage.src = photo.src;
        viewerImage.alt = photo.label;
        buildProgress(photos.length);
        photoViewer.showModal();
      }

      function closeViewer() {
        if (photoViewer.open) photoViewer.close();
      }

      function showNextPhoto(direction) {
        const albumId = state.activeAlbumId;
        const photos = getAlbumPhotos(albumId);
        if (!photos.length) return;

        state.activePhotoIndex = (state.activePhotoIndex + direction + photos.length) % photos.length;
        openViewer(state.activePhotoIndex);
      }

      async function loadPhotos() {
        try {
          const response = await fetch('photos.json', { cache: 'no-store' });
          if (!response.ok) throw new Error('Not found');

          const data = await response.json();
          Object.keys(data).forEach((albumId) => {
            const files = Array.isArray(data[albumId]) ? data[albumId] : [];
            state.albums[albumId] = files.map((file) => ({
              src: `./${albumId}/${file}`,
              label: toLabel(file)
            }));
          });

          renderAlbumCards();
        } catch (error) {
          albumGrid.innerHTML = '<div style="grid-column:1/-1;padding:18px;border:1px solid var(--line);border-radius:18px;background:var(--panel);color:var(--muted);">Photos could not be loaded from photos.json.</div>';
        }
      }

      document.getElementById('brandButton').addEventListener('click', () => {
        closeAlbum();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      });

      document.getElementById('themeToggle').addEventListener('click', () => {
        const nextTheme = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
        setTheme(nextTheme);
      });

      document.getElementById('backButton').addEventListener('click', closeAlbum);
      document.getElementById('closeViewer').addEventListener('click', closeViewer);
      document.getElementById('previousPhoto').addEventListener('click', () => showNextPhoto(-1));
      document.getElementById('nextPhoto').addEventListener('click', () => showNextPhoto(1));

      document.addEventListener('keydown', (event) => {
        if (event.key === 'Escape' && photoViewer.open) closeViewer();
        if (!photoViewer.open) return;
        if (event.key === 'ArrowLeft') showNextPhoto(-1);
        if (event.key === 'ArrowRight') showNextPhoto(1);
      });

      photoViewer.addEventListener('click', (event) => {
        if (event.target === photoViewer) closeViewer();
      });

      const savedTheme = localStorage.getItem('my-story-theme') || 'light';
      setTheme(savedTheme);
      loadPhotos();
    </script>
  </body>
</html>
