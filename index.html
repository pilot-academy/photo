<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f7f7f8">
  <meta name="description" content="Samir's history — personal photo album">
  <title>Samir's History</title>
  <style>
    :root {
      color-scheme: light;
      --page: #f3f5f7;
      --paper: rgba(255,255,255,0.72);
      --ink: #14181d;
      --muted: #5d6773;
      --soft: #7d8a98;
      --line: rgba(18,24,32,0.09);
      --blue: #0b6cf2;
      --blue-strong: #0a57d9;
      --shadow: 0 20px 60px rgba(16, 24, 40, 0.12);
      --radius-xl: 28px;
      --radius-lg: 22px;
      --radius-md: 16px;
      --width: 1180px;
    }

    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
    body {
      margin: 0;
      background:
        radial-gradient(circle at top left, rgba(11,108,242,0.08), transparent 28%),
        radial-gradient(circle at top right, rgba(15, 23, 42, 0.08), transparent 30%),
        var(--page);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }
    button { color: inherit; font: inherit; }
    button:focus-visible { outline: 3px solid rgba(11,108,242,0.38); outline-offset: 3px; }
    img { -webkit-user-drag: none; user-select: none; }
    [hidden] { display: none !important; }

    .app-header {
      position: sticky;
      top: 0;
      z-index: 30;
      backdrop-filter: saturate(180%) blur(18px);
      -webkit-backdrop-filter: saturate(180%) blur(18px);
      background: rgba(243,245,247,0.72);
      border-bottom: 1px solid rgba(17,24,39,0.06);
    }

    .header-inner, .main, .footer-inner {
      width: min(var(--width), calc(100% - 48px));
      margin-inline: auto;
    }

    .header-inner {
      min-height: 78px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      border: 0;
      padding: 0;
      background: transparent;
      color: var(--ink);
      cursor: pointer;
      font-size: 13px;
      font-weight: 800;
      letter-spacing: .16em;
      text-transform: uppercase;
    }

    .brand-mark {
      display: grid;
      place-items: center;
      width: 34px;
      height: 34px;
      border-radius: 12px;
      background: linear-gradient(135deg, #121821, #2d4050);
      color: #fff;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0;
    }

    .language-picker {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 5px;
      border: 1px solid rgba(20,24,29,0.08);
      border-radius: 999px;
      background: rgba(255,255,255,0.6);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.6);
    }

    .lang-button {
      min-width: 42px;
      height: 30px;
      padding: 0 12px;
      border: 0;
      border-radius: 999px;
      background: transparent;
      color: var(--muted);
      font-size: 10px;
      font-weight: 800;
      letter-spacing: .08em;
      cursor: pointer;
      transition: transform .18s ease, background .18s ease, color .18s ease;
    }

    .lang-button:hover { background: rgba(17,24,39,0.04); }
    .lang-button:active { transform: scale(0.98); }
    .lang-button[aria-pressed="true"] {
      color: #fff;
      background: linear-gradient(135deg, #111827, #1d2e3d);
      box-shadow: 0 6px 18px rgba(17,24,39,0.2);
    }

    .main {
      min-height: calc(100svh - 120px);
      padding-top: clamp(34px, 6vw, 72px);
      padding-bottom: 76px;
    }

    .intro { margin-bottom: 30px; }

    .eyebrow {
      margin: 0 0 12px;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.3;
      font-weight: 800;
      letter-spacing: .16em;
      text-transform: uppercase;
    }

    h1, h2, p { margin-top: 0; }

    .page-title {
      margin: 0;
      font-size: clamp(38px, 5vw, 64px);
      line-height: 0.96;
      font-weight: 800;
      letter-spacing: -0.07em;
    }

    .page-subtitle {
      max-width: 620px;
      margin: 16px 0 0;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.7;
    }

    .album-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 26px 22px;
    }

    .album-card {
      display: block;
      width: 100%;
      min-width: 0;
      padding: 0;
      border: 0;
      background: transparent;
      text-align: left;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .album-cover {
      position: relative;
      display: block;
      overflow: hidden;
      width: 100%;
      aspect-ratio: 1.18 / 1;
      border: 1px solid rgba(17,24,39,0.05);
      border-radius: var(--radius-lg);
      background: linear-gradient(135deg, rgba(17,24,39,0.04), rgba(11,108,242,0.04));
      box-shadow: var(--shadow);
      isolation: isolate;
    }

    .album-cover::after {
      position: absolute;
      inset: 0;
      content: "";
      pointer-events: none;
      background: linear-gradient(180deg, transparent 30%, rgba(0,0,0,0.18));
      opacity: .7;
    }

    .album-cover > img {
      position: relative;
      z-index: 1;
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform .45s cubic-bezier(.2,.7,.2,1);
    }

    .album-card:hover .album-cover > img { transform: scale(1.045); }

    .cover-fallback {
      position: absolute;
      inset: 0;
      z-index: 1;
      display: grid;
      place-items: center;
      color: rgba(20,24,29,0.38);
    }

    .cover-fallback svg {
      width: 42px;
      height: 42px;
      stroke: currentColor;
      stroke-width: 1.4;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .album-card[data-album="1"] .album-cover { background: linear-gradient(140deg, #efe7dc, #d9d3ca); }
    .album-card[data-album="2"] .album-cover { background: linear-gradient(145deg, #e9eef5, #dfeaf7); }
    .album-card[data-album="3"] .album-cover { background: linear-gradient(145deg, #f0efef, #e1e0df); }

    .cover-number {
      position: absolute;
      right: 12px;
      bottom: 12px;
      z-index: 2;
      color: rgba(255,255,255,0.92);
      font-size: 10px;
      font-weight: 800;
      letter-spacing: .12em;
      text-shadow: 0 1px 8px rgba(0,0,0,0.32);
    }

    .album-info {
      display: block;
      padding: 15px 2px 0;
    }

    .album-title {
      display: block;
      color: var(--ink);
      font-size: 15px;
      line-height: 1.4;
      font-weight: 700;
      letter-spacing: -0.04em;
      overflow-wrap: anywhere;
    }

    .album-meta {
      display: block;
      margin-top: 6px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.5;
      font-variant-numeric: tabular-nums;
    }

    .album-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      margin: 1px 0 32px;
    }

    .back-button {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 14px 10px 10px;
      border: 1px solid rgba(17,24,39,0.08);
      border-radius: 999px;
      background: rgba(255,255,255,0.72);
      box-shadow: 0 10px 26px rgba(17,24,39,0.05);
      color: #2b343d;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      transition: transform .18s ease, background .18s ease;
    }

    .back-button:hover { background: rgba(255,255,255,0.88); }
    .back-button:active { transform: scale(0.98); }

    .back-button svg {
      width: 15px;
      height: 15px;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .toolbar-label {
      color: var(--soft);
      font-size: 10px;
      font-weight: 800;
      letter-spacing: .15em;
      text-transform: uppercase;
    }

    .album-heading {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 18px;
      margin-bottom: 24px;
    }

    .album-heading .page-title {
      max-width: 780px;
      font-size: clamp(30px, 4vw, 46px);
    }

    .item-count {
      flex: 0 0 auto;
      padding-bottom: 6px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    .photo-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 10px;
    }

    .photo-tile {
      position: relative;
      display: block;
      min-width: 0;
      overflow: hidden;
      padding: 0;
      aspect-ratio: 1 / 1;
      border: 0;
      border-radius: 14px;
      background: rgba(17,24,39,0.04);
      cursor: zoom-in;
      box-shadow: 0 6px 16px rgba(17,24,39,0.08);
    }

    .photo-tile img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform .3s ease;
    }

    .photo-tile:hover img { transform: scale(1.045); }
    .photo-tile:active img { transform: scale(1.02); }

    .photo-index {
      position: absolute;
      right: 8px;
      bottom: 7px;
      color: rgba(255,255,255,0.9);
      font-size: 9px;
      font-weight: 800;
      text-shadow: 0 1px 6px rgba(0,0,0,0.38);
      opacity: .9;
    }

    .message {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      margin-top: 16px;
      padding: 16px 18px;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: rgba(255,255,255,0.72);
      color: var(--muted);
      box-shadow: 0 12px 24px rgba(17,24,39,0.04);
    }

    .message-dot {
      flex: 0 0 auto;
      width: 8px;
      height: 8px;
      margin-top: 6px;
      border-radius: 50%;
      background: #b5b9c0;
    }

    .message[data-state="loading"] .message-dot {
      background: var(--blue);
      box-shadow: 0 0 0 4px rgba(11,108,242,0.15);
      animation: pulse 1.4s ease-in-out infinite;
    }

    .message[data-state="error"] .message-dot { background: #d97706; }

    @keyframes pulse {
      50% { box-shadow: 0 0 0 7px rgba(11,108,242,0); }
    }

    .app-footer {
      border-top: 1px solid rgba(17,24,39,0.06);
      background: rgba(255,255,255,0.18);
    }

    .footer-inner {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      padding-top: 18px;
      padding-bottom: max(22px, env(safe-area-inset-bottom));
      color: #75829a;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .12em;
      text-transform: uppercase;
    }

    dialog.viewer {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      max-width: none;
      max-height: none;
      margin: 0;
      padding: 0;
      overflow: hidden;
      border: 0;
      background: #0b0d12;
      color: #fff;
    }

    dialog.viewer::backdrop { background: rgba(11, 13, 18, 0.9); }

    .viewer-layout {
      display: grid;
      grid-template-rows: auto minmax(0,1fr) auto;
      width: 100%;
      height: 100%;
      height: 100dvh;
      padding-top: env(safe-area-inset-top);
    }

    .viewer-header {
      display: grid;
      grid-template-columns: 44px 1fr 44px;
      align-items: center;
      gap: 12px;
      min-height: 62px;
      padding: 12px 18px;
    }

    .viewer-title-wrap { min-width: 0; text-align: center; }

    .viewer-title {
      display: block;
      overflow: hidden;
      font-size: 12px;
      font-weight: 700;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .viewer-count {
      display: block;
      margin-top: 4px;
      color: #aaaaaf;
      font-size: 10px;
      font-variant-numeric: tabular-nums;
    }

    .viewer-icon {
      display: grid;
      place-items: center;
      width: 40px;
      height: 40px;
      padding: 0;
      border: 1px solid rgba(255,255,255,0.18);
      border-radius: 50%;
      background: rgba(255,255,255,0.08);
      color: white;
      cursor: pointer;
      transition: background .18s ease;
    }

    .viewer-icon:hover { background: rgba(255,255,255,0.16); }
    .viewer-icon svg {
      width: 19px;
      height: 19px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.7;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .viewer-stage {
      position: relative;
      display: grid;
      place-items: center;
      min-height: 0;
      padding: 6px 58px;
      touch-action: pan-y;
    }

    .viewer-image {
      display: block;
      max-width: 100%;
      max-height: 100%;
      width: auto;
      height: auto;
      object-fit: contain;
      user-select: none;
      -webkit-user-select: none;
      border-radius: 14px;
      box-shadow: 0 16px 40px rgba(0,0,0,0.4);
    }

    .viewer-arrow {
      position: absolute;
      top: 50%;
      z-index: 2;
      transform: translateY(-50%);
    }

    .viewer-arrow:disabled { opacity: .25; cursor: default; }
    .viewer-prev { left: 18px; }
    .viewer-next { right: 18px; }

    .viewer-bottom {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      min-height: 72px;
      padding: 12px 22px max(18px, env(safe-area-inset-bottom));
    }

    .viewer-caption {
      min-width: 0;
      overflow: hidden;
      color: #d7d7db;
      font-size: 12px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .viewer-progress {
      display: flex;
      align-items: center;
      gap: 5px;
      flex: 0 0 auto;
    }

    .progress-dot {
      display: block;
      width: 5px;
      height: 5px;
      border-radius: 99px;
      background: rgba(255,255,255,0.35);
      transition: width .16s ease, background .16s ease;
    }

    .progress-dot.active {
      width: 17px;
      background: #fff;
    }

    @media (max-width: 760px) {
      .header-inner, .main, .footer-inner { width: min(var(--width), calc(100% - 32px)); }
      .header-inner { min-height: 68px; }
      .main { padding-top: 32px; }

      .album-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px 14px; }
      .album-cover { aspect-ratio: .97 / 1; border-radius: 16px; }
      .album-title { font-size: 13px; }
      .album-meta { margin-top: 4px; font-size: 11px; }

      .photo-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
      .photo-tile { border-radius: 10px; }

      .album-toolbar { margin-bottom: 27px; }
      .album-heading {
        align-items: flex-start;
        flex-direction: column;
        gap: 8px;
        margin-bottom: 18px;
      }

      .item-count { padding: 0; }
      .viewer-stage { padding-inline: 8px; }
      .viewer-arrow {
        width: 36px;
        height: 36px;
        border-color: transparent;
        background: rgba(0,0,0,0.2);
      }
      .viewer-prev { left: 7px; }
      .viewer-next { right: 7px; }
      .viewer-bottom { min-height: 66px; padding-inline: 16px; }
    }

    @media (max-width: 380px) {
      .brand { gap: 8px; font-size: 11px; letter-spacing: .1em; }
      .brand-mark { width: 28px; height: 28px; }
      .lang-button { min-width: 32px; padding-inline: 7px; }
      .page-title { font-size: 31px; }
      .album-title { font-size: 12px; }
      .photo-grid { grid-template-columns: repeat(2, minmax(0,1fr)); gap: 5px; }
      .viewer-header { padding-inline: 12px; }
      .viewer-stage { padding-inline: 2px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        scroll-behavior: auto !important;
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .01ms !important;
      }
    }
  </style>
</head>
<body>
  <header class="app-header">
    <div class="header-inner">
      <button class="brand" id="homeBrand" type="button" aria-label="Home">
        <span class="brand-mark" aria-hidden="true">SH</span>
        <span>Samir's History</span>
      </button>
      <div class="language-picker" role="group" aria-label="Language" id="languagePicker">
        <button class="lang-button" type="button" data-lang="en" aria-pressed="true">EN</button>
      </div>
    </div>
  </header>

  <main class="main">
    <section id="homeView" aria-labelledby="homeTitle">
      <div class="intro">
        <p class="eyebrow" data-i18n="libraryLabel">Personal Photo Library</p>
        <h1 class="page-title" id="homeTitle" data-i18n="albumsTitle">Samir's History</h1>
        <p class="page-subtitle" data-i18n="homeSubtitle">Three chapters. One story. Every memory in its own album.</p>
      </div>

      <div class="album-grid" id="albumGrid" aria-label="Photo albums"></div>

      <div class="message" id="homeMessage" role="status" aria-live="polite" data-state="loading">
        <span class="message-dot" aria-hidden="true"></span>
        <span id="homeMessageText">Loading photos…</span>
      </div>
    </section>

    <section id="albumView" aria-labelledby="albumPageTitle" hidden>
      <div class="album-toolbar">
        <button class="back-button" id="backToAlbums" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m14.5 5-7 7 7 7M8 12h12"/></svg>
          <span data-i18n="backToAlbums">Albums</span>
        </button>
        <span class="toolbar-label" data-i18n="libraryLabel">Personal Photo Library</span>
      </div>

      <div class="album-heading">
        <div>
          <p class="eyebrow" id="albumEyebrow">ALBUM 01</p>
          <h1 class="page-title" id="albumPageTitle">My Childhood</h1>
        </div>
        <p class="item-count" id="albumItemCount"></p>
      </div>

      <div class="photo-grid" id="photoGrid"></div>

      <div class="message" id="albumMessage" role="status" aria-live="polite" hidden>
        <span class="message-dot" aria-hidden="true"></span>
        <span id="albumMessageText"></span>
      </div>
    </section>
  </main>

  <footer class="app-footer">
    <div class="footer-inner">
      <span data-i18n="footerLeft">Samir's History · Personal Photo Album</span>
      <span data-i18n="footerRight">Memories live here.</span>
    </div>
  </footer>

  <dialog class="viewer" id="photoViewer" aria-label="Photo viewer">
    <div class="viewer-layout">
      <div class="viewer-header">
        <button class="viewer-icon" id="closeViewer" type="button" aria-label="Close photo" title="Close">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg>
        </button>

        <div class="viewer-title-wrap">
          <strong class="viewer-title" id="viewerAlbumTitle">MY CHILDHOOD</strong>
          <span class="viewer-count" id="viewerCount">01 / 01</span>
        </div>

        <span aria-hidden="true"></span>
      </div>

      <div class="viewer-stage" id="viewerStage">
        <button class="viewer-icon viewer-arrow viewer-prev" id="previousPhoto" type="button" aria-label="Previous photo">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>
        </button>

        <img class="viewer-image" id="viewerImage" alt="" draggable="false">

        <button class="viewer-icon viewer-arrow viewer-next" id="nextPhoto" type="button" aria-label="Next photo">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>
        </button>
      </div>

      <div class="viewer-bottom">
        <div class="viewer-caption" id="viewerCaption"></div>
        <div class="viewer-progress" id="viewerProgress" aria-hidden="true"></div>
      </div>
    </div>
  </dialog>

  <script>
    const IMAGE_EXTENSIONS = /\.(avif|gif|jpe?g|png|webp|bmp|svg)$/i;

    const ALBUMS = [
      { id: "1", number: "01", key: "childhood", photos: [], state: "loading", errorCode: "" },
      { id: "2", number: "02", key: "aviation", photos: [], state: "loading", errorCode: "" },
      { id: "3", number: "03", key: "wrestling", photos: [], state: "loading", errorCode: "" }
    ];

    const TEXT = {
      en: {
        brand: "SAMIR'S HISTORY",
        libraryLabel: "Personal Photo Library",
        albumsTitle: "Samir's History",
        homeSubtitle: "Three chapters. One story. Every memory in its own album.",
        localFileHelp: "To read photo folders automatically, open the site with RUN-LOCAL.bat inside the photo folder instead of double-clicking the HTML file. No folder selection is needed.",
        localServerHelp: "Could not read the file list in folders 1/, 2/, 3/. Run RUN-LOCAL.bat inside the photo folder.",
        childhood: "My Childhood",
        aviation: "My Aviation Journey",
        wrestling: "My Passion for Wrestling",
        childhoodDesc: "Memories from the early years",
        aviationDesc: "Steps toward the sky",
        wrestlingDesc: "Strength, discipline, and will",
        backToAlbums: "Albums",
        photos: "photos",
        onePhoto: "1 photo",
        loading: "Loading photos…",
        loadingShort: "Loading…",
        noPhotos: "There are no photos in this album yet.",
        repositoryMissing: "GitHub site could not be detected. For local folders, run RUN-LOCAL.bat.",
        folderError: "The photo manifest could not be loaded. Make sure photos.json exists in the repository root and GitHub Pages is serving the main branch correctly.",
        genericError: "Could not fetch photos. Check that the repository is public and your internet connection works.",
        networkError: "Could not connect to GitHub. Check your internet connection and reload the page.",
        emptyRepository: "The albums are ready, but no photos were found. Upload JPG, PNG, WEBP, AVIF, BMP, GIF, or SVG images to folders 1/, 2/, and 3/ at the repository root.",
        openAlbum: "Open album",
        openPhoto: "Open photo",
        closePhoto: "Close photo",
        previous: "Previous photo",
        next: "Next photo",
        footerLeft: "Samir's History · Personal Photo Album",
        footerRight: "Memories live here."
      }
    };

    const homeView = document.getElementById("homeView");
    const albumView = document.getElementById("albumView");
    const albumGrid = document.getElementById("albumGrid");
    const photoGrid = document.getElementById("photoGrid");
    const homeMessage = document.getElementById("homeMessage");
    const homeMessageText = document.getElementById("homeMessageText");
    const albumMessage = document.getElementById("albumMessage");
    const albumMessageText = document.getElementById("albumMessageText");
    const viewer = document.getElementById("photoViewer");
    const viewerImage = document.getElementById("viewerImage");

    let language = readSavedLanguage();
    let activeAlbumId = null;
    let activePhotoIndex = 0;
    let touchStartX = null;
    let sourceMode = "loading";

    function readSavedLanguage() {
      try {
        const saved = localStorage.getItem("my-story-language");
        if (saved === "en") return "en";
      } catch (_) {}
      return "en";
    }

    function t(key) { return TEXT[language][key] || TEXT.en[key] || key; }
    function albumTitle(album) { return t(album.key); }

    function fileLabel(filename) {
      return filename.replace(/\.[^.]+$/, "").replace(/[_-]+/g, " ").replace(/\s+/g, " ").trim() || "Photo";
    }

    function formatCount(count) {
      if (count === 1) return t("onePhoto");
      return `${count} ${t("photos")}`;
    }

    function showMessage(element, textElement, message, state = "info") {
      element.dataset.state = state;
      textElement.textContent = message;
      element.hidden = false;
    }

    function sortManifestNames(names) {
      return [...names].sort((a, b) => {
        const aNew = /2026-/.test(a);
        const bNew = /2026-/.test(b);
        if (aNew !== bNew) return aNew ? 1 : -1;
        return a.localeCompare(b, undefined, { numeric: true, sensitivity: "base" });
      });
    }

    function renderAlbumCards() {
      albumGrid.replaceChildren();

      for (const album of ALBUMS) {
        const card = document.createElement("button");
        card.className = "album-card";
        card.type = "button";
        card.dataset.album = album.id;
        card.setAttribute("aria-label", `${t("openAlbum")}: ${albumTitle(album)}`);

        const cover = document.createElement("span");
        cover.className = "album-cover";

        const fallback = document.createElement("span");
        fallback.className = "cover-fallback";
        fallback.setAttribute("aria-hidden", "true");
        fallback.innerHTML = `
          <svg viewBox="0 0 48 48">
            <rect x="8" y="8" width="32" height="32" rx="7"></rect>
            <circle cx="18" cy="18" r="3"></circle>
            <path d="m10 33 10-10 7 7 5-5 6 6"></path>
          </svg>
        `;

        cover.appendChild(fallback);

        if (album.photos.length) {
          const coverImage = document.createElement("img");
          coverImage.src = album.photos[0].src;
          coverImage.alt = "";
          coverImage.loading = "lazy";
          coverImage.decoding = "async";
          coverImage.addEventListener("error", () => coverImage.remove(), { once: true });
          cover.insertBefore(coverImage, fallback);
        }

        const coverNumber = document.createElement("span");
        coverNumber.className = "cover-number";
        coverNumber.textContent = album.number;
        cover.appendChild(coverNumber);

        const info = document.createElement("span");
        info.className = "album-info";

        const title = document.createElement("span");
        title.className = "album-title";
        title.textContent = albumTitle(album);

        const meta = document.createElement("span");
        meta.className = "album-meta";
        meta.textContent = album.state === "loading" ? t("loadingShort") : formatCount(album.photos.length);

        info.append(title, meta);
        card.append(cover, info);
        card.addEventListener("click", () => openAlbum(album.id));
        albumGrid.appendChild(card);
      }
    }

    function renderLanguage() {
      document.documentElement.lang = language;
      document.title = `${t("brand")}`;
      document.querySelectorAll("[data-i18n]").forEach(node => {
        const key = node.dataset.i18n;
        if (TEXT[language][key]) node.textContent = t(key);
      });
      document.querySelectorAll("[data-lang]").forEach(button => {
        button.setAttribute("aria-pressed", String(button.dataset.lang === language));
      });

      const picker = document.querySelector(".language-picker");
      if (picker) picker.setAttribute("aria-label", "Choose language");

      renderAlbumCards();

      if (activeAlbumId) renderAlbumPage();
      updateViewerLabels();

      if (sourceMode === "local-file") {
        showMessage(homeMessage, homeMessageText, t("localFileHelp"), "error");
      } else if (sourceMode === "local-server" && !ALBUMS.some(album => album.photos.length) && !ALBUMS.some(album => album.state === "loading")) {
        showMessage(homeMessage, homeMessageText, t("localServerHelp"), "error");
      } else if (ALBUMS.some(a => a.state === "loading")) {
        showMessage(homeMessage, homeMessageText, t("loading"), "loading");
      } else {
        updateHomeMessage();
      }
    }

    function updateHomeMessage() {
      const waiting = ALBUMS.some(album => album.state === "loading");
      const total = ALBUMS.reduce((sum, album) => sum + album.photos.length, 0);

      if (waiting) {
        showMessage(homeMessage, homeMessageText, t("loading"), "loading");
      } else if (total > 0) {
        homeMessage.hidden = true;
      } else {
        const anyError = ALBUMS.some(album => album.state === "error");
        const failedAlbum = ALBUMS.find(album => album.state === "error");
        const message = anyError ? t(failedAlbum?.errorCode || "genericError") : t("emptyRepository");
        showMessage(homeMessage, homeMessageText, message, anyError ? "error" : "info");
      }
    }

    function openAlbum(id) {
      const album = ALBUMS.find(item => item.id === id);
      if (!album) return;

      activeAlbumId = id;
      homeView.hidden = true;
      albumView.hidden = false;
      viewer.close();
      renderAlbumPage();
      window.scrollTo({ top: 0, behavior: "auto" });
    }

    function goHome() {
      activeAlbumId = null;
      albumView.hidden = true;
      homeView.hidden = false;
      viewer.close();
      window.scrollTo({ top: 0, behavior: "auto" });
      renderAlbumCards();
    }

    function renderAlbumPage() {
      const album = ALBUMS.find(item => item.id === activeAlbumId);
      if (!album) return;

      document.getElementById("albumEyebrow").textContent = `ALBUM ${album.number}`;
      document.getElementById("albumPageTitle").textContent = albumTitle(album);
      document.getElementById("albumItemCount").textContent = album.state === "loading" ? t("loadingShort") : formatCount(album.photos.length);

      photoGrid.replaceChildren();

      album.photos.forEach((photo, index) => {
        const button = document.createElement("button");
        button.className = "photo-tile";
        button.type = "button";
        button.setAttribute("aria-label", `${t("openPhoto")}: ${photo.label}`);

        const image = document.createElement("img");
        image.src = photo.src;
        image.alt = photo.label;
        image.loading = "lazy";
        image.decoding = "async";
        image.addEventListener("error", () => {
          button.remove();
          if (!photo.failed) photo.failed = true;
        }, { once: true });

        const number = document.createElement("span");
        number.className = "photo-index";
        number.textContent = String(index + 1).padStart(2, "0");

        button.append(image, number);
        button.addEventListener("click", () => openPhoto(index));
        photoGrid.appendChild(button);
      });

      albumMessage.hidden = true;

      if (album.state === "loading") {
        showMessage(albumMessage, albumMessageText, t("loading"), "loading");
      } else if (album.state === "error") {
        showMessage(albumMessage, albumMessageText, t(album.errorCode || "genericError"), "error");
      } else if (!album.photos.length) {
        showMessage(albumMessage, albumMessageText, t("noPhotos"), "info");
      }
    }

    function openPhoto(index) {
      const album = ALBUMS.find(item => item.id === activeAlbumId);
      if (!album || !album.photos.length) return;
      activePhotoIndex = Math.max(0, Math.min(index, album.photos.length - 1));
      updateViewer();
      if (!viewer.open) viewer.showModal();
    }

    function updateViewerLabels() {
      document.getElementById("closeViewer").setAttribute("aria-label", t("closePhoto"));
      document.getElementById("previousPhoto").setAttribute("aria-label", t("previous"));
      document.getElementById("nextPhoto").setAttribute("aria-label", t("next"));

      const album = ALBUMS.find(item => item.id === activeAlbumId);
      if (album) document.getElementById("viewerAlbumTitle").textContent = albumTitle(album);
    }

    function updateViewer() {
      const album = ALBUMS.find(item => item.id === activeAlbumId);
      if (!album || !album.photos[activePhotoIndex]) return;

      const photo = album.photos[activePhotoIndex];
      viewerImage.src = photo.src;
      viewerImage.alt = photo.label;
      document.getElementById("viewerAlbumTitle").textContent = albumTitle(album);
      document.getElementById("viewerCount").textContent = `${String(activePhotoIndex + 1).padStart(2, "0")} / ${String(album.photos.length).padStart(2, "0")}`;
      document.getElementById("viewerCaption").textContent = photo.label;

      document.getElementById("previousPhoto").disabled = album.photos.length < 2;
      document.getElementById("nextPhoto").disabled = album.photos.length < 2;

      const progress = document.getElementById("viewerProgress");
      progress.replaceChildren();

      if (album.photos.length <= 15) {
        album.photos.forEach((_, index) => {
          const dot = document.createElement("span");
          dot.className = "progress-dot" + (index === activePhotoIndex ? " active" : "");
          progress.appendChild(dot);
        });
      } else {
        const dot = document.createElement("span");
        dot.className = "progress-dot active";
        dot.style.width = `${Math.max(8, (activePhotoIndex + 1) / album.photos.length * 60)}px`;
        progress.appendChild(dot);
      }

      updateViewerLabels();
    }

    function stepPhoto(direction) {
      const album = ALBUMS.find(item => item.id === activeAlbumId);
      if (!album || album.photos.length < 2) return;

      activePhotoIndex = (activePhotoIndex + direction + album.photos.length) % album.photos.length;
      updateViewer();
    }

    class GitHubLoadError extends Error {
      constructor(code) { super(code); this.name = "GitHubLoadError"; this.code = code; }
    }

    async function loadManifest() {
      const response = await fetch("photos.json", { cache: "no-cache" });
      if (!response.ok) throw new GitHubLoadError("notFound");

      const manifest = await response.json();
      if (!manifest || typeof manifest !== "object") throw new GitHubLoadError("notFound");

      for (const album of ALBUMS) {
        const names = Array.isArray(manifest[album.id]) ? manifest[album.id] : [];
        const sortedNames = sortManifestNames(names.filter(name => typeof name === "string" && IMAGE_EXTENSIONS.test(name)));

        album.photos = sortedNames.map(name => ({
          src: `${album.id}/${encodeURIComponent(name)}`,
          label: fileLabel(name),
          filename: name,
          failed: false
        }));

        album.state = "loaded";
        album.errorCode = "";
      }
    }

    document.getElementById("homeBrand").addEventListener("click", goHome);
    document.getElementById("backToAlbums").addEventListener("click", goHome);

    document.querySelectorAll("[data-lang]").forEach(button => {
      button.addEventListener("click", () => {
        language = button.dataset.lang;
        try { localStorage.setItem("my-story-language", language); } catch (_) {}
        renderLanguage();
      });
    });

    document.getElementById("closeViewer").addEventListener("click", () => viewer.close());
    document.getElementById("previousPhoto").addEventListener("click", () => stepPhoto(-1));
    document.getElementById("nextPhoto").addEventListener("click", () => stepPhoto(1));

    viewer.addEventListener("click", event => {
      if (event.target === viewer) viewer.close();
    });

    viewer.addEventListener("keydown", event => {
      if (event.key === "ArrowLeft") { event.preventDefault(); stepPhoto(-1); }
      if (event.key === "ArrowRight") { event.preventDefault(); stepPhoto(1); }
    });

    const viewerStage = document.getElementById("viewerStage");
    viewerStage.addEventListener("touchstart", event => {
      touchStartX = event.changedTouches[0]?.clientX ?? null;
    }, { passive: true });

    viewerStage.addEventListener("touchend", event => {
      if (touchStartX === null) return;
      const delta = event.changedTouches[0].clientX - touchStartX;
      if (Math.abs(delta) > 48) stepPhoto(delta < 0 ? 1 : -1);
      touchStartX = null;
    }, { passive: true });

    async function loadLocalHttpAlbum(album) {
      const directoryUrl = new URL(`./${album.id}/`, location.href);
      const response = await fetch(directoryUrl.href, { cache: "no-store" });
      if (!response.ok) throw new Error(`Cannot list folder ${album.id}`);

      const listing = await response.text();
      const doc = new DOMParser().parseFromString(listing, "text/html");
      const currentDirectory = decodeURIComponent(directoryUrl.pathname).replace(/\/+$/, "") + "/";
      const files = [];

      for (const link of doc.querySelectorAll("a[href]")) {
        const href = link.getAttribute("href");
        if (!href || href.startsWith("?") || href.startsWith("#")) continue;

        let fileUrl;
        try { fileUrl = new URL(href, directoryUrl); } catch (_) { continue; }
        if (fileUrl.origin !== location.origin) continue;

        const decodedPath = decodeURIComponent(fileUrl.pathname);
        if (!decodedPath.startsWith(currentDirectory)) continue;

        const filename = decodedPath.slice(currentDirectory.length);
        if (!filename || filename.includes("/") || !IMAGE_EXTENSIONS.test(filename)) continue;

        files.push({
          src: fileUrl.href,
          label: fileLabel(filename),
          filename,
          failed: false
        });
      }

      const collator = new Intl.Collator(undefined, { numeric: true, sensitivity: "base" });
      files.sort((a, b) => {
        const aNew = /2026-/.test(a.filename);
        const bNew = /2026-/.test(b.filename);
        if (aNew !== bNew) return aNew ? 1 : -1;
        return collator.compare(a.filename, b.filename);
      });

      album.photos = files;
      album.state = "loaded";
      album.errorCode = "";
    }

    async function loadLocalHttpAlbums() {
      sourceMode = "local-server";

      await Promise.all(ALBUMS.map(async album => {
        try {
          await loadLocalHttpAlbum(album);
        } catch (_) {
          album.photos = [];
          album.state = "error";
          album.errorCode = "localServerHelp";
        }
      }));

      renderAlbumCards();
      albumGrid.hidden = false;

      const total = ALBUMS.reduce((sum, album) => sum + album.photos.length, 0);
      if (total > 0) {
        homeMessage.hidden = true;
      } else {
        showMessage(homeMessage, homeMessageText, t("localServerHelp"), "error");
      }

      if (activeAlbumId) renderAlbumPage();
    }

    async function init() {
      renderLanguage();
      renderAlbumCards();

      if (location.protocol === "file:") {
        sourceMode = "local-file";
        ALBUMS.forEach(album => {
          album.state = "loaded";
          album.photos = [];
          album.errorCode = "";
        });
        albumGrid.hidden = true;
        showMessage(homeMessage, homeMessageText, t("localFileHelp"), "error");
        return;
      }

      sourceMode = "remote";

      try {
        await loadManifest();
        renderAlbumCards();
        albumGrid.hidden = false;
        updateHomeMessage();
      } catch (error) {
        const code = error instanceof GitHubLoadError ? error.code : "generic";
        const errorCode = code === "network" ? "networkError" : "folderError";

        ALBUMS.forEach(album => {
          album.state = "error";
          album.errorCode = errorCode;
        });

        renderAlbumCards();
        updateHomeMessage();
      }

      if (activeAlbumId) renderAlbumPage();
    }

    init();
  </script>
</body>
</html>
