<!doctype html>
<html lang="uz">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f7f7f8">
  <meta name="description" content="A personal photo album: childhood, aviation, and wrestling.">
  <title>My Story — Albums</title>
  <style>
    :root {
      color-scheme: light;
      --page: #f7f7f8;
      --paper: #fff;
      --ink: #1d1d1f;
      --muted: #77777d;
      --soft: #a1a1a6;
      --line: #e7e7ea;
      --blue: #087ff5;
      --radius: 20px;
      --width: 1080px;
    }
    *, *::before, *::after { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      margin: 0;
      background: var(--page);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }
    button { color: inherit; font: inherit; }
    button:focus-visible { outline: 3px solid #8fc5ff; outline-offset: 3px; }
    img { -webkit-user-drag: none; user-select: none; }
    [hidden] { display: none !important; }

    .app-header {
      position: sticky; top: 0; z-index: 20;
      background: rgba(247,247,248,.88);
      border-bottom: 1px solid rgba(29,29,31,.065);
      backdrop-filter: saturate(180%) blur(22px);
      -webkit-backdrop-filter: saturate(180%) blur(22px);
    }
    .header-inner, .main, .footer-inner { width: min(var(--width), calc(100% - 48px)); margin-inline: auto; }
    .header-inner { min-height: 66px; display: flex; align-items: center; justify-content: space-between; gap: 20px; }
    .brand { display: inline-flex; align-items: center; gap: 10px; border: 0; padding: 0; background: transparent; cursor: pointer; font-size: 13px; font-weight: 750; letter-spacing: -.035em; }
    .brand-mark { display: grid; place-items: center; width: 31px; height: 31px; border-radius: 10px; background: var(--ink); color: #fff; font-size: 11px; letter-spacing: -.06em; }
    .language-picker { display: inline-flex; align-items: center; gap: 2px; padding: 3px; border: 1px solid #e5e5e8; border-radius: 999px; background: rgba(255,255,255,.72); }
    .lang-button { min-width: 38px; height: 29px; padding: 0 9px; border: 0; border-radius: 999px; background: transparent; color: #77777d; font-size: 10px; font-weight: 750; cursor: pointer; transition: color .16s, background .16s, box-shadow .16s; }
    .lang-button[aria-pressed="true"] { color: #fff; background: #262629; box-shadow: 0 1px 3px #00000018; }

    .main { min-height: calc(100svh - 126px); padding-top: clamp(34px, 5.5vw, 66px); padding-bottom: 76px; }
    .intro { margin-bottom: 30px; }
    .eyebrow { margin: 0 0 11px; color: var(--muted); font-size: 10px; line-height: 1.4; font-weight: 750; letter-spacing: .12em; text-transform: uppercase; }
    h1, h2, p { margin-top: 0; }
    .page-title { margin: 0; font-size: clamp(34px, 5vw, 48px); line-height: 1.06; font-weight: 750; letter-spacing: -.065em; }
    .page-subtitle { max-width: 550px; margin: 12px 0 0; color: var(--muted); font-size: 14px; line-height: 1.65; }
    .album-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 28px 20px; }
    .album-card { display: block; width: 100%; min-width: 0; padding: 0; border: 0; background: transparent; text-align: left; cursor: pointer; -webkit-tap-highlight-color: transparent; }
    .album-cover {
      position: relative; display: block; overflow: hidden; width: 100%; aspect-ratio: 1.12 / 1;
      border-radius: 18px; background: #e6e6e9; isolation: isolate;
      box-shadow: 0 1px 1px #00000008;
    }
    .album-cover::after { position: absolute; inset: 45% 0 0; content: ""; pointer-events: none; background: linear-gradient(transparent, rgba(0,0,0,.16)); opacity: .45; }
    .album-cover > img { position: relative; z-index: 1; display: block; width: 100%; height: 100%; object-fit: cover; transition: transform .45s cubic-bezier(.2,.7,.2,1); }
    .album-card:hover .album-cover > img { transform: scale(1.035); }
    .cover-fallback { position: absolute; inset: 0; display: grid; place-items: center; color: rgba(40,40,45,.46); }
    .album-card[data-album="1"] .album-cover { background: linear-gradient(145deg, #e9e5de, #d9d5cc); }
    .album-card[data-album="2"] .album-cover { background: linear-gradient(145deg, #e3eaf1, #cbd8e4); }
    .album-card[data-album="3"] .album-cover { background: linear-gradient(145deg, #e7e5e5, #d7d4d4); }
    .cover-fallback svg { width: 38px; height: 38px; stroke: currentColor; stroke-width: 1.35; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .cover-number { position: absolute; right: 12px; bottom: 10px; z-index: 2; color: rgba(255,255,255,.9); font-size: 10px; font-weight: 700; letter-spacing: .08em; text-shadow: 0 1px 6px #0005; }
    .album-info { display: block; padding: 12px 2px 0; }
    .album-title { display: block; font-size: 14px; line-height: 1.35; font-weight: 700; letter-spacing: -.025em; overflow-wrap: anywhere; }
    .album-meta { display: block; margin-top: 5px; color: var(--muted); font-size: 12px; line-height: 1.4; }
    .album-card:focus-visible .album-cover { outline: 3px solid #8fc5ff; outline-offset: 3px; }

    .album-toolbar { display: flex; align-items: center; justify-content: space-between; gap: 18px; margin: 1px 0 32px; }
    .back-button { display: inline-flex; align-items: center; gap: 8px; padding: 9px 12px 9px 9px; border: 1px solid var(--line); border-radius: 999px; background: #fff; color: #4d4d52; font-size: 12px; font-weight: 650; cursor: pointer; transition: background .16s, transform .16s; }
    .back-button:hover { background: #f0f0f2; }
    .back-button:active { transform: scale(.98); }
    .back-button svg { width: 15px; height: 15px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .toolbar-label { color: var(--soft); font-size: 10px; font-weight: 750; letter-spacing: .12em; text-transform: uppercase; }
    .album-heading { display: flex; align-items: end; justify-content: space-between; gap: 20px; margin-bottom: 24px; }
    .album-heading .page-title { max-width: 780px; font-size: clamp(30px, 4.4vw, 43px); }
    .item-count { flex: 0 0 auto; padding-bottom: 5px; color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; white-space: nowrap; }
    .photo-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 9px; }
    .photo-tile { position: relative; display: block; min-width: 0; overflow: hidden; padding: 0; aspect-ratio: 1 / 1; border: 0; border-radius: 12px; background: #e6e6e9; cursor: zoom-in; }
    .photo-tile img { display: block; width: 100%; height: 100%; object-fit: cover; transition: transform .3s ease; }
    .photo-tile:hover img { transform: scale(1.045); }
    .photo-tile:active img { transform: scale(1.015); }
    .photo-index { position: absolute; right: 8px; bottom: 7px; color: white; font-size: 9px; font-weight: 700; text-shadow: 0 1px 5px #0009; opacity: .9; }

    .message { display: flex; align-items: flex-start; gap: 12px; margin-top: 16px; padding: 16px 17px; border: 1px solid var(--line); border-radius: 14px; background: #fff; color: var(--muted); font-size: 12px; line-height: 1.65; }
    .message-dot { flex: 0 0 auto; width: 7px; height: 7px; margin-top: 6px; border-radius: 50%; background: #a4a4aa; }
    .message[data-state="loading"] .message-dot { background: var(--blue); box-shadow: 0 0 0 4px #087ff51a; animation: pulse 1.3s ease-in-out infinite; }
    .message[data-state="error"] .message-dot { background: #cf7a3a; }
    @keyframes pulse { 50% { box-shadow: 0 0 0 7px #087ff500; } }

    .app-footer { border-top: 1px solid var(--line); }
    .footer-inner { display: flex; justify-content: space-between; gap: 16px; padding-top: 19px; padding-bottom: max(24px, env(safe-area-inset-bottom)); color: #929298; font-size: 10px; }

    dialog.viewer {
      position: fixed; inset: 0; width: 100%; height: 100%; max-width: none; max-height: none;
      margin: 0; padding: 0; overflow: hidden; border: 0; border-radius: 0; background: #101012; color: #fff;
    }
    dialog.viewer::backdrop { background: #101012; }
    .viewer-layout { display: grid; grid-template-rows: auto minmax(0,1fr) auto; width: 100%; height: 100%; height: 100dvh; padding-top: env(safe-area-inset-top); }
    .viewer-header { display: grid; grid-template-columns: 44px 1fr 44px; align-items: center; gap: 12px; min-height: 62px; padding: 10px 18px; }
    .viewer-title-wrap { min-width: 0; text-align: center; }
    .viewer-title { display: block; overflow: hidden; font-size: 12px; font-weight: 700; text-overflow: ellipsis; white-space: nowrap; }
    .viewer-count { display: block; margin-top: 4px; color: #9c9ca2; font-size: 10px; font-variant-numeric: tabular-nums; }
    .viewer-icon { display: grid; place-items: center; width: 40px; height: 40px; padding: 0; border: 1px solid #ffffff20; border-radius: 50%; background: #ffffff0d; color: white; cursor: pointer; transition: background .16s; }
    .viewer-icon:hover { background: #ffffff20; }
    .viewer-icon svg { width: 19px; height: 19px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
    .viewer-stage { position: relative; display: grid; place-items: center; min-height: 0; padding: 6px 58px; touch-action: pan-y; }
    .viewer-image { display: block; max-width: 100%; max-height: 100%; width: auto; height: auto; object-fit: contain; user-select: none; -webkit-user-select: none; }
    .viewer-arrow { position: absolute; top: 50%; z-index: 2; transform: translateY(-50%); }
    .viewer-arrow:disabled { opacity: .25; cursor: default; }
    .viewer-prev { left: 18px; }
    .viewer-next { right: 18px; }
    .viewer-bottom { display: flex; align-items: center; justify-content: space-between; gap: 16px; min-height: 72px; padding: 12px 22px max(18px, env(safe-area-inset-bottom)); }
    .viewer-caption { min-width: 0; overflow: hidden; color: #d6d6da; font-size: 12px; text-overflow: ellipsis; white-space: nowrap; }
    .viewer-progress { display: flex; align-items: center; gap: 5px; flex: 0 0 auto; }
    .progress-dot { display: block; width: 5px; height: 5px; border-radius: 99px; background: #626267; transition: width .16s, background .16s; }
    .progress-dot.active { width: 17px; background: #fff; }

    @media (max-width: 760px) {
      .header-inner, .main, .footer-inner { width: min(var(--width), calc(100% - 32px)); }
      .header-inner { min-height: 60px; }
      .main { padding-top: 34px; }
      .album-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 25px 13px; }
      .album-cover { aspect-ratio: .98 / 1; border-radius: 14px; }
      .album-title { font-size: 12px; }
      .album-meta { margin-top: 4px; font-size: 11px; }
      .photo-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 5px; }
      .photo-tile { border-radius: 7px; }
      .album-toolbar { margin-bottom: 27px; }
      .album-heading { align-items: flex-start; flex-direction: column; gap: 8px; margin-bottom: 19px; }
      .item-count { padding: 0; }
      .viewer-stage { padding-inline: 8px; }
      .viewer-arrow { width: 36px; height: 36px; border-color: transparent; background: #0002; }
      .viewer-prev { left: 7px; }
      .viewer-next { right: 7px; }
      .viewer-bottom { min-height: 66px; padding-inline: 16px; }
    }
    @media (max-width: 380px) {
      .brand { gap: 7px; font-size: 11px; }
      .brand-mark { width: 28px; height: 28px; }
      .lang-button { min-width: 32px; padding-inline: 7px; }
      .page-title { font-size: 32px; }
      .album-title { font-size: 11px; }
      .photo-grid { grid-template-columns: repeat(2, minmax(0,1fr)); gap: 5px; }
      .viewer-header { padding-inline: 12px; }
      .viewer-stage { padding-inline: 2px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
    }
  </style>
</head>

  <header class="app-header">
    <div class="header-inner">
      <button class="brand" id="homeBrand" type="button" aria-label="Home">
        <span class="brand-mark" aria-hidden="true">MS</span><span data-i18n="brand">MY STORY</span>
      </button>
      <div class="language-picker" role="group" aria-label="Language" id="languagePicker">
        <button class="lang-button" type="button" data-lang="uz" aria-pressed="true">UZ</button>
        <button class="lang-button" type="button" data-lang="ru" aria-pressed="false">RU</button>
        <button class="lang-button" type="button" data-lang="en" aria-pressed="false">EN</button>
      </div>
    </div>
  </header>

  <main class="main">
    <section id="homeView" aria-labelledby="homeTitle">
      <div class="intro">
        <p class="eyebrow" data-i18n="libraryLabel">SHAXSIY FOTOARXIV</p>
        <h1 class="page-title" id="homeTitle" data-i18n="albumsTitle">Albomlar</h1>
        <p class="page-subtitle" data-i18n="homeSubtitle">Uch bob. Bir hikoya. Har bir xotira o‘z albomida.</p>
      </div>
      <div class="album-grid" id="albumGrid" aria-label="Photo albums"></div>
      <div class="message" id="homeMessage" role="status" aria-live="polite" data-state="loading">
        <span class="message-dot" aria-hidden="true"></span><span id="homeMessageText">Suratlar yuklanmoqda…</span>
      </div>
    </section>

    <section id="albumView" aria-labelledby="albumPageTitle" hidden>
      <div class="album-toolbar">
        <button class="back-button" id="backToAlbums" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m14.5 5-7 7 7 7M8 12h12"/></svg>
          <span data-i18n="backToAlbums">Albomlar</span>
        </button>
        <span class="toolbar-label" data-i18n="libraryLabel">SHAXSIY FOTOARXIV</span>
      </div>
      <div class="album-heading">
        <div>
          <p class="eyebrow" id="albumEyebrow">ALBUM 01</p>
          <h1 class="page-title" id="albumPageTitle">BOLALIGIM</h1>
        </div>
        <p class="item-count" id="albumItemCount"></p>
      </div>
      <div class="photo-grid" id="photoGrid"></div>
      <div class="message" id="albumMessage" role="status" aria-live="polite" hidden>
        <span class="message-dot" aria-hidden="true"></span><span id="albumMessageText"></span>
      </div>
    </section>
  </main>

  <footer class="app-footer">
    <div class="footer-inner"><span data-i18n="footerLeft">MY STORY · SHAXSIY FOTOALBOM</span><span data-i18n="footerRight">Xotiralar shu yerda saqlanadi.</span></div>
  </footer>

  <dialog class="viewer" id="photoViewer" aria-label="Photo viewer">
    <div class="viewer-layout">
      <div class="viewer-header">
        <button class="viewer-icon" id="closeViewer" type="button" aria-label="Close photo" title="Close">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg>
        </button>
        <div class="viewer-title-wrap"><strong class="viewer-title" id="viewerAlbumTitle">BOLALIGIM</strong><span class="viewer-count" id="viewerCount">01 / 01</span></div>
        <span aria-hidden="true"></span>
      </div>
      <div class="viewer-stage" id="viewerStage">
        <button class="viewer-icon viewer-arrow viewer-prev" id="previousPhoto" type="button" aria-label="Previous photo">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>
        </button>
        <img class="viewer-image" id="viewerImage" alt="" draggable="false">
        <button class="viewer-icon viewer-arrow viewer-next" id="nextPhoto" type="button" aria-label="Next photo">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>
        </button>
      </div>
      <div class="viewer-bottom"><div class="viewer-caption" id="viewerCaption"></div><div class="viewer-progress" id="viewerProgress" aria-hidden="true"></div></div>
    </div>
  </dialog>

        openAlbum: "Open album", openPhoto: "Open photo", closePhoto: "Close photo",
        previous: "Previous photo", next: "Next photo", footerLeft: "MY STORY · PERSONAL PHOTO ALBUM", footerRight: "Memories live here."
      }
    };

    const homeView = document.getElementById("homeView");
    const albumView = document.getElementById("albumView");
    const albumGrid = document.getElementById("albumGrid");
    const photoGrid = document.getElementById("photoGrid");
    const homeMessage = document.getElementById("homeMessage");
    const homeMessageText = document.getElementById("homeMessageText");
    const albumMessage = document.getElementById("albumMessage");
    const albumMessageText = document.getElementById("albumMessageText");
    const viewer = document.getElementById("photoViewer");
    const viewerImage = document.getElementById("viewerImage");
    let language = readSavedLanguage();
    let activeAlbumId = null;
    let activePhotoIndex = 0;
    let touchStartX = null;
    let sourceMode = "loading";

    function readSavedLanguage() {
      try { const saved = localStorage.getItem("my-story-language"); if (saved && TEXT[saved]) return saved; } catch (_) {}
      return "uz";
    }
    function t(key) { return TEXT[language][key] || TEXT.en[key] || key; }
    function albumTitle(album) { return t(album.key); }
    function albumDescription(album) { return t(album.key + "Desc"); }

    function findRepository() {
      // On GitHub Pages, infer the owner/repository from the site URL. No manual
      // repository setting is needed for normal username.github.io/repository/ URLs.
      const host = location.hostname.toLowerCase();
      if (host.endsWith(".github.io")) {
        const owner = host.slice(0, -".github.io".length);
        const parts = location.pathname.split("/").filter(Boolean);
        const first = parts[0] && parts[0].toLowerCase() !== "index.html" ? parts[0] : "";
        return { owner, repo: first || `${owner}.github.io` };
      }
      return null;
    }

    class GitHubLoadError extends Error {
      constructor(code) { super(code); this.name = "GitHubLoadError"; this.code = code; }
    }

    async function githubContents(repository, path = "") {
      const safePath = path.split("/").filter(Boolean).map(encodeURIComponent).join("/");
      const query = "";
      const endpoint = `https://api.github.com/repos/${encodeURIComponent(repository.owner)}/${encodeURIComponent(repository.repo)}/contents${safePath ? `/${safePath}` : ""}${query}`;
      let response;
      try {
        response = await fetch(endpoint, {
          headers: { Accept: "application/vnd.github+json" },
          cache: "no-store"
        });
      } catch (_) {
        throw new GitHubLoadError("network");
      }
      if (response.status === 404) throw new GitHubLoadError("notFound");
      if (response.status === 403 || response.status === 429) throw new GitHubLoadError("limit");
      if (!response.ok) throw new GitHubLoadError("generic");
      const entries = await response.json();
      if (!Array.isArray(entries)) throw new GitHubLoadError("notFolder");
      return entries;
    }

    function hasAlbumFolder(entries) {
      return entries.some(item => item.type === "dir" && ["1", "2", "3"].includes(item.name));
    }

    async function findAlbumsBase(repository) {
      // First look beside index.html. If Pages is published from /docs or another
      // common static-site folder, look there too. Directory listing is impossible
      // in browser-only hosting, so GitHub's public Contents API is used explicitly.
      const rootEntries = await githubContents(repository, "");
      if (hasAlbumFolder(rootEntries)) return "";
      const candidates = ["docs", "public", "site", "website", "www", "dist", "build"];
      for (const candidate of candidates) {
        if (!rootEntries.some(item => item.type === "dir" && item.name === candidate)) continue;
        try {
          const entries = await githubContents(repository, candidate);
          if (hasAlbumFolder(entries)) return candidate;
        } catch (error) {
          if (!(error instanceof GitHubLoadError) || !["notFound", "notFolder"].includes(error.code)) throw error;
        }
      }
      throw new GitHubLoadError("albumsMissing");
    }

    function fileLabel(filename) {
      return filename.replace(/\.[^.]+$/, "").replace(/[_-]+/g, " ").replace(/\s+/g, " ").trim() || "Photo";
    }
    function formatCount(count) {
      if (count === 1) return t("onePhoto");
      return `${count} ${t("photos")}`;
    }
    function showMessage(element, textElement, message, state = "info") {
      element.dataset.state = state;
      textElement.textContent = message;
      element.hidden = false;
    }

    function renderAlbumCards() {
      albumGrid.replaceChildren();
      for (const album of ALBUMS) {
        const card = document.createElement("button");
        card.className = "album-card";
        card.type = "button";
        card.dataset.album = album.id;
        card.setAttribute("aria-label", `${t("openAlbum")}: ${albumTitle(album)}`);

        const cover = document.createElement("span");
        cover.className = "album-cover";
        const fallback = document.createElement("span");
        fallback.className = "cover-fallback";
        fallback.setAttribute("aria-hidden", "true");
        fallback.innerHTML = '<svg viewBox="0 0 48 48"><rect x="8" y="8" width="32" height="32" rx="7"></rect><circle cx="18" cy="18" r="3"></circle><path d="m10 33 10-10 7 7 5-5 6 6"></path></svg>';
        cover.appendChild(fallback);
        if (album.photos.length) {
          const coverImage = document.createElement("img");
          coverImage.src = album.photos[0].src;
          coverImage.alt = "";
          coverImage.loading = "lazy";
          coverImage.decoding = "async";
          coverImage.addEventListener("error", () => coverImage.remove(), { once: true });
          cover.insertBefore(coverImage, fallback);
        }
        const coverNumber = document.createElement("span");
        coverNumber.className = "cover-number";
        coverNumber.textContent = album.number;
        cover.appendChild(coverNumber);

        const info = document.createElement("span");
        info.className = "album-info";
        const title = document.createElement("span");
        title.className = "album-title";
        title.textContent = albumTitle(album);
        const meta = document.createElement("span");
        meta.className = "album-meta";
        meta.textContent = album.state === "loading" ? t("loadingShort") : formatCount(album.photos.length);
        info.append(title, meta);
        card.append(cover, info);
        card.addEventListener("click", () => openAlbum(album.id));
        albumGrid.appendChild(card);
      }
    }

    function renderLanguage() {
      document.documentElement.lang = language;
      document.title = `${t("brand")} — ${t("albumsTitle")}`;
      document.querySelectorAll("[data-i18n]").forEach(node => {
        const key = node.dataset.i18n;
        if (TEXT[language][key]) node.textContent = t(key);
      });
      document.querySelectorAll("[data-lang]").forEach(button => button.setAttribute("aria-pressed", String(button.dataset.lang === language)));
      document.querySelector(".language-picker").setAttribute("aria-label", language === "uz" ? "Tilni tanlash" : language === "ru" ? "Выбор языка" : "Choose language");
      renderAlbumCards();
      if (activeAlbumId) renderAlbumPage();
      updateViewerLabels();
      if (sourceMode === "local-file") showMessage(homeMessage, homeMessageText, t("localFileHelp"), "error");
      else if (sourceMode === "local-server" && !ALBUMS.some(album => album.photos.length) && !ALBUMS.some(album => album.state === "loading")) showMessage(homeMessage, homeMessageText, t("localServerHelp"), "error");
      else if (ALBUMS.some(a => a.state === "loading")) showMessage(homeMessage, homeMessageText, t("loading"), "loading");
      else updateHomeMessage();
    }

    function updateHomeMessage() {
      const waiting = ALBUMS.some(album => album.state === "loading");
      const total = ALBUMS.reduce((sum, album) => sum + album.photos.length, 0);
      if (waiting) showMessage(homeMessage, homeMessageText, t("loading"), "loading");
      else if (total > 0) homeMessage.hidden = true;
      else {
        const anyError = ALBUMS.some(album => album.state === "error");
        const failedAlbum = ALBUMS.find(album => album.state === "error");
        const message = anyError ? t(failedAlbum?.errorCode || "genericError") : t("emptyRepository");
        showMessage(homeMessage, homeMessageText, message, anyError ? "error" : "info");
      }
    }

    function openAlbum(id) {
      const album = ALBUMS.find(item => item.id === id);
      if (!album) return;
      activeAlbumId = id;
      homeView.hidden = true;
      albumView.hidden = false;
      viewer.close();
      renderAlbumPage();
      window.scrollTo({ top: 0, behavior: "auto" });
    }

    function goHome() {
      activeAlbumId = null;
      albumView.hidden = true;
      homeView.hidden = false;
      viewer.close();
      window.scrollTo({ top: 0, behavior: "auto" });
      renderAlbumCards();
    }

    function renderAlbumPage() {
      const album = ALBUMS.find(item => item.id === activeAlbumId);
      if (!album) return;
      document.getElementById("albumEyebrow").textContent = `${language === "uz" ? "ALBOM" : language === "ru" ? "АЛЬБОМ" : "ALBUM"} ${album.number}`;
      document.getElementById("albumPageTitle").textContent = albumTitle(album);
      document.getElementById("albumItemCount").textContent = album.state === "loading" ? t("loadingShort") : formatCount(album.photos.length);
      photoGrid.replaceChildren();
      album.photos.forEach((photo, index) => {
        const button = document.createElement("button");
        button.className = "photo-tile";
        button.type = "button";
        button.setAttribute("aria-label", `${t("openPhoto")}: ${photo.label}`);
        const image = document.createElement("img");
        image.src = photo.src;
        image.alt = photo.label;
        image.loading = "lazy";
        image.decoding = "async";
        image.addEventListener("error", () => {
          button.remove();
          if (!photo.failed) { photo.failed = true; }
        }, { once: true });
        const number = document.createElement("span");
        number.className = "photo-index";
        number.textContent = String(index + 1).padStart(2, "0");
        button.append(image, number);
        button.addEventListener("click", () => openPhoto(index));
        photoGrid.appendChild(button);
      });

      albumMessage.hidden = true;
      if (album.state === "loading") showMessage(albumMessage, albumMessageText, t("loading"), "loading");
      else if (album.state === "error") showMessage(albumMessage, albumMessageText, t(album.errorCode || "genericError"), "error");
      else if (!album.photos.length) showMessage(albumMessage, albumMessageText, t("noPhotos"), "info");
    }

    function openPhoto(index) {
      const album = ALBUMS.find(item => item.id === activeAlbumId);
      if (!album || !album.photos.length) return;
      activePhotoIndex = Math.max(0, Math.min(index, album.photos.length - 1));
      updateViewer();
      if (!viewer.open) viewer.showModal();
    }

    function updateViewerLabels() {
      document.getElementById("closeViewer").setAttribute("aria-label", t("closePhoto"));
      document.getElementById("previousPhoto").setAttribute("aria-label", t("previous"));
      document.getElementById("nextPhoto").setAttribute("aria-label", t("next"));
      const album = ALBUMS.find(item => item.id === activeAlbumId);
      if (album) document.getElementById("viewerAlbumTitle").textContent = albumTitle(album);
    }

    function updateViewer() {
      const album = ALBUMS.find(item => item.id === activeAlbumId);
      if (!album || !album.photos[activePhotoIndex]) return;
      const photo = album.photos[activePhotoIndex];
      viewerImage.src = photo.src;
      viewerImage.alt = photo.label;
      document.getElementById("viewerAlbumTitle").textContent = albumTitle(album);
      document.getElementById("viewerCount").textContent = `${String(activePhotoIndex + 1).padStart(2, "0")} / ${String(album.photos.length).padStart(2, "0")}`;
      document.getElementById("viewerCaption").textContent = photo.label;
      document.getElementById("previousPhoto").disabled = album.photos.length < 2;
      document.getElementById("nextPhoto").disabled = album.photos.length < 2;
      const progress = document.getElementById("viewerProgress");
      progress.replaceChildren();
      const maxDots = Math.min(album.photos.length, 15);
      if (album.photos.length <= 15) {
        album.photos.forEach((_, index) => {
          const dot = document.createElement("span");
          dot.className = "progress-dot" + (index === activePhotoIndex ? " active" : "");
          progress.appendChild(dot);
        });
      } else {
        const dot = document.createElement("span");
        dot.className = "progress-dot active";
        dot.style.width = `${Math.max(8, (activePhotoIndex + 1) / album.photos.length * 60)}px`;
        progress.appendChild(dot);
      }
      updateViewerLabels();
    }

    function stepPhoto(direction) {
      const album = ALBUMS.find(item => item.id === activeAlbumId);
      if (!album || album.photos.length < 2) return;
      activePhotoIndex = (activePhotoIndex + direction + album.photos.length) % album.photos.length;
      updateViewer();
    }

    async function loadAlbum(album, repository, albumsBase) {
      const path = [albumsBase, album.id].filter(Boolean).join("/");
      try {
        const entries = await githubContents(repository, path);
        const files = entries
          .filter(item => item.type === "file" && IMAGE_EXTENSIONS.test(item.name))
          .sort((a, b) => a.name.localeCompare(b.name, undefined, { numeric: true, sensitivity: "base" }));

        // Natural filename order means 1.jpg, 2.jpg, 10.jpg. The first sorted
        // image becomes the album cover; all remaining images appear inside it.
        album.photos = files.map(file => ({
          src: file.download_url,
          label: fileLabel(file.name),
          filename: file.name,
          failed: false
        }));
        album.state = "loaded";
        album.errorCode = "";
      } catch (error) {
        album.photos = [];
        album.state = "error";
        const code = error instanceof GitHubLoadError ? error.code : "generic";
        album.errorCode = code === "limit" ? "apiLimit"
          : code === "notFound" || code === "notFolder" ? "folderError"
          : code === "albumsMissing" ? "folderError"
          : code === "network" ? "networkError"
          : "genericError";
      }
    }

    document.getElementById("homeBrand").addEventListener("click", goHome);
    document.getElementById("backToAlbums").addEventListener("click", goHome);
    document.querySelectorAll("[data-lang]").forEach(button => button.addEventListener("click", () => {
      language = button.dataset.lang;
      try { localStorage.setItem("my-story-language", language); } catch (_) {}
      renderLanguage();
    }));
    document.getElementById("closeViewer").addEventListener("click", () => viewer.close());
    document.getElementById("previousPhoto").addEventListener("click", () => stepPhoto(-1));
    document.getElementById("nextPhoto").addEventListener("click", () => stepPhoto(1));
    viewer.addEventListener("click", event => { if (event.target === viewer) viewer.close(); });
    viewer.addEventListener("keydown", event => {
      if (event.key === "ArrowLeft") { event.preventDefault(); stepPhoto(-1); }
      if (event.key === "ArrowRight") { event.preventDefault(); stepPhoto(1); }
    });
    const viewerStage = document.getElementById("viewerStage");
    viewerStage.addEventListener("touchstart", event => { touchStartX = event.changedTouches[0]?.clientX ?? null; }, { passive: true });
    viewerStage.addEventListener("touchend", event => {
      if (touchStartX === null) return;
      const delta = event.changedTouches[0].clientX - touchStartX;
      if (Math.abs(delta) > 48) stepPhoto(delta < 0 ? 1 : -1);
      touchStartX = null;
    }, { passive: true });

    async function loadLocalHttpAlbum(album) {
      const directoryUrl = new URL(`./${album.id}/`, location.href);
      const response = await fetch(directoryUrl.href, { cache: "no-store" });
      if (!response.ok) throw new Error(`Cannot list folder ${album.id}`);
      const listing = await response.text();
      const doc = new DOMParser().parseFromString(listing, "text/html");
      const currentDirectory = decodeURIComponent(directoryUrl.pathname).replace(/\/+$/, "") + "/";
      const files = [];

      for (const link of doc.querySelectorAll("a[href]")) {
        const href = link.getAttribute("href");
        if (!href || href.startsWith("?") || href.startsWith("#")) continue;
        let fileUrl;
        try { fileUrl = new URL(href, directoryUrl); } catch (_) { continue; }
        if (fileUrl.origin !== location.origin) continue;
        const decodedPath = decodeURIComponent(fileUrl.pathname);
        if (!decodedPath.startsWith(currentDirectory)) continue;
        const filename = decodedPath.slice(currentDirectory.length);
        if (!filename || filename.includes("/") || !IMAGE_EXTENSIONS.test(filename)) continue;
        files.push({ src: fileUrl.href, label: fileLabel(filename), filename, failed: false });
      }

      const collator = new Intl.Collator(undefined, { numeric: true, sensitivity: "base" });
      files.sort((a, b) => collator.compare(a.filename, b.filename));
      album.photos = files;
      album.state = "loaded";
      album.errorCode = "";
    }

    async function loadLocalHttpAlbums() {
      sourceMode = "local-server";
      await Promise.all(ALBUMS.map(async album => {
        try {
          await loadLocalHttpAlbum(album);
        } catch (_) {
          album.photos = [];
          album.state = "error";
          album.errorCode = "localServerHelp";
        }
      }));
      renderAlbumCards();
      albumGrid.hidden = false;
      const total = ALBUMS.reduce((sum, album) => sum + album.photos.length, 0);
      if (total > 0) {
        homeMessage.hidden = true;
      } else {
        showMessage(homeMessage, homeMessageText, t("localServerHelp"), "error");
      }
      if (activeAlbumId) renderAlbumPage();
    }

    async function init() {
      renderLanguage();
      renderAlbumCards();

      // A local file:// page cannot enumerate sibling folders in modern browsers.
      // RUN-LOCAL.bat starts a tiny local web server, whose directory listings
      // let this one HTML file discover all images without a picker or manifest.
      if (location.protocol === "file:") {
        sourceMode = "local-file";
        ALBUMS.forEach(album => { album.state = "loaded"; album.photos = []; album.errorCode = ""; });
        albumGrid.hidden = true;
        showMessage(homeMessage, homeMessageText, t("localFileHelp"), "error");
        return;
      }

      const repository = findRepository();
      if (!repository) {
        await loadLocalHttpAlbums();
        return;
      }

      sourceMode = "remote";
      try {
        const albumsBase = await findAlbumsBase(repository);
        await Promise.all(ALBUMS.map(album => loadAlbum(album, repository, albumsBase)));
        renderAlbumCards();
        albumGrid.hidden = false;
        updateHomeMessage();
      } catch (error) {
        const code = error instanceof GitHubLoadError ? error.code : "generic";
        const errorCode = code === "limit" ? "apiLimit"
          : code === "network" ? "networkError"
          : code === "notFound" ? "folderError"
          : "folderError";
        ALBUMS.forEach(album => { album.state = "error"; album.errorCode = errorCode; });
        renderAlbumCards();
        updateHomeMessage();
      }
      if (activeAlbumId) renderAlbumPage();
    }
    init();
  </script>
</body>
</html>
